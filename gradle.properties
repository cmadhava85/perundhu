# ===== JVM MEMORY CONFIGURATION =====
# Prevents OutOfMemory errors during builds
# Xmx = max heap memory, Xms = initial heap memory
# Using 4GB max for typical CI/CD environments
org.gradle.jvmargs=-Xmx4g -Xms1g -XX:+UseG1GC -XX:MaxGCPauseMillis=200

# ===== GRADLE PERFORMANCE =====
# Enable parallel builds for faster compilation across multiple processors
org.gradle.parallel=true
# Number of worker threads (typically CPU cores)
org.gradle.workers.max=4

# ===== BUILD CACHE =====
# Enable Gradle build cache for faster rebuilds
org.gradle.caching=true

# ===== DAEMON SETTINGS =====
# Run Gradle in daemon mode (persistent JVM) for faster builds
org.gradle.daemon=true
# Keep daemon alive for 3 hours of idleness (prevents memory leaks)
org.gradle.daemon.idletimeout=10800000

# ===== DEBUG INFO =====
# Show all compiler warnings
org.gradle.warning.mode=all

# ===== PLUGIN CONFIGURATION =====
# Ensure consistent behavior across machines
org.gradle.configuration-on-demand=false
