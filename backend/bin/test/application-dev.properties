# Development Configuration - Disable Security for Testing

# ============================================
# PROFILE-SPECIFIC SETTINGS (Dev Only)
# ============================================
# Note: spring.profiles.active should be set at runtime, not in profile-specific files
# It can be set via:
#   - application.properties (main config file)
#   - Environment variable: SPRING_PROFILES_ACTIVE
#   - Command line: -Dspring.profiles.active=dev

# Disable all security filters for development/testing
security.api.rate-limit.enabled=false
security.ip-filtering.enabled=false
security.monitoring.enabled=false
security.anti-scraping.enabled=false
security.filters.enabled=false
security.origin-validation.enabled=false

# Allow higher rate limits for development
security.rate-limit.public-endpoints=1000
security.ip-filtering.max-requests-per-second=100

# Enable detailed logging for debugging
logging.level.com.perundhu=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# CORS - Allow all origins for development
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000

# Disable reCAPTCHA for development
recaptcha.enabled=false

# Disable honeypot for development testing
security.honeypot.enabled=false

# Show SQL queries in development
spring.jpa.show-sql=true

# Enable Flyway in development
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
