# Development Environment Configuration
# ============================================
# Local development with H2 in-memory database
# ============================================

# H2 Database configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console access
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Flyway configuration (disabled for local development)
spring.flyway.enabled=false

# Server configuration
server.port=${SERVER_PORT:8080}

# Multipart file upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
spring.servlet.multipart.enabled=true

# Logging - Development settings (verbose)
logging.level.root=INFO
logging.level.com.perundhu=DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Console output
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# CORS Configuration - Allow localhost for development
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
cors.max-age=${CORS_MAX_AGE:3600}

# File storage configuration for Development
app.file.base-url=${APP_FILE_BASE_URL:http://localhost:8080}

# Security settings (relaxed for development)
security.require-ssl=false

# reCAPTCHA - Disabled for local development
recaptcha.enabled=false
recaptcha.site-key=6Lf-qkAsAAAAAMsufKTr2pb6mh9_OSEYcDyl7juE
recaptcha.secret-key=local-test-secret
recaptcha.score-threshold=0.5

# ============================================
# JWT CONFIGURATION (Development)
# ============================================
# JWT Secret for local development
app.jwtSecret=dev-secret-key-change-in-production-do-not-use-in-prod
app.jwtExpirationInMs=86400000

# JWT token settings
security.jwt.algorithm=HS512
security.jwt.issuer=perundhu-api-dev
security.jwt.subject=perundhu-user-dev
security.jwt.audience=perundhu-app-dev
security.jwt.refresh-expiration=604800000

# Admin authentication - Local defaults
admin.auth.enabled=true
admin.auth.username=admin
admin.auth.password=admin123

# Rate limiting - Disabled for development
security.rate-limit.enabled=false

# API Key - Disabled for development
security.api-key.enabled=false

# Disable Secret Manager auto-configuration for local development
spring.cloud.gcp.secretmanager.enabled=false

# Allow bean definition overriding
spring.main.allow-bean-definition-overriding=true
