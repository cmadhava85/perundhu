# Local Development Configuration
# This file is for LOCAL development ONLY - do NOT commit to git
# Usage: ./gradlew bootRun --args='--spring.profiles.active=local'

# ==================================================
# SECURITY FILTERS - DISABLED FOR LOCAL DEVELOPMENT
# ==================================================
security.origin-validation.enabled=false
security.origin-validation.strict-mode=false
rate-limit.enabled=false
security.api-key.enabled=false
security.ip-filtering.enabled=false
security.ip-filtering.block-suspicious-agents=false
security.anti-scraping.enabled=false
security.allow-curl-in-local=true

# ==================================================
# CORS - ALLOW ALL LOCALHOST PORTS
# ==================================================
cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:4173,http://localhost:3000,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:8080
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,HEAD,PATCH
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

security.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:4173,http://localhost:3000,http://localhost:8080

# ==================================================
# DATABASE - LOCAL MYSQL
# ==================================================
spring.datasource.url=jdbc:mysql://localhost:3306/perundhu?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# ==================================================
# LOGGING - VERBOSE FOR DEBUGGING
# ==================================================
logging.level.com.perundhu=DEBUG
logging.level.com.perundhu.infrastructure.security=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Log all requests
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

# ==================================================
# JPA - SHOW SQL QUERIES
# ==================================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ==================================================
# FILE UPLOAD - LOCAL STORAGE
# ==================================================
app.file.upload-dir=./uploads/images
app.file.max-size=10485760
app.file.base-url=http://localhost:8080

# ==================================================
# DEVELOPMENT FEATURES
# ==================================================
# Faster restarts
spring.devtools.restart.enabled=true

# Better error messages
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# ==================================================
# NOTES
# ==================================================
# ADMIN AUTHENTICATION - LOCAL DEVELOPMENT
# ==================================================
admin.auth.username=admin
admin.auth.password=admin123
admin.auth.enabled=true

# ==================================================
# NOTES
# ==================================================
# ==================================================
# This configuration:
# - Disables all security filters for easy testing
# - Allows requests from any localhost port
# - Shows detailed SQL queries and logs
# - Provides verbose error messages
#
# DO NOT USE IN PRODUCTION!
