# PreProd Environment Configuration with MySQL on GCP
# ============================================
# ENVIRONMENT VARIABLE BASED CONFIGURATION
# ============================================
# Secrets are passed via Cloud Run --set-secrets flag as environment variables
# This avoids the need for Secret Manager client library and native SSL issues

# Disable Secret Manager auto-configuration to avoid native library crashes
spring.cloud.gcp.secretmanager.enabled=false

spring.datasource.url=jdbc:mysql://34.180.30.115:3306/perundhu?useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=60000&socketTimeout=120000
spring.datasource.username=${DB_USERNAME:${MYSQL_USERNAME:perundhu_user}}
spring.datasource.password=${DB_PASSWORD:${MYSQL_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool configuration with longer timeouts for migrations
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:3}
spring.datasource.hikari.connection-timeout=${HIKARI_TIMEOUT:45000}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=PerundhuPreprodHikariCP

# Multipart file upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
spring.servlet.multipart.enabled=true

# Flyway configuration for pre-production
# DISABLED on startup to allow container to start without DB connectivity
# Migrations are run separately via the CD pipeline before deployment
# To enable: set FLYWAY_ENABLED=true as environment variable
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# Hibernate configuration for MySQL
# DDL set to 'validate' - schema is managed by Flyway migrations
# This ensures consistency between Flyway and Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}

# Server configuration
server.port=${SERVER_PORT:8080}

# File storage configuration for PreProd
app.file.base-url=${APP_FILE_BASE_URL:https://perundhu-backend-preprod-1032721240281.asia-south1.run.app}

# CORS Configuration for PreProd (allow both frontend Cloud Run URL formats)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://perundhu-frontend-preprod-1032721240281.asia-south1.run.app,https://perundhu-frontend-preprod-c6qn3mz4wa-el.a.run.app}

# Logging with traceId for request tracking in Cloud Run
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.perundhu=${LOG_LEVEL_APP:INFO}
logging.level.org.flywaydb=INFO

# Cloud Run logging pattern - JSON-friendly with traceId
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId:-NO_TRACE}] [%X{clientIp:-}] [%thread] %-5level %logger{36} - %msg%n

# ============================================
# PREPROD SECURITY CONFIGURATION
# ============================================
# Rate Limiting - Enabled with moderate limits
rate-limit.enabled=true
rate-limit.read.requests-per-minute=100
rate-limit.write.requests-per-minute=20
rate-limit.upload.requests-per-minute=10

# Origin Validation - Enabled, non-strict mode for testing
security.origin-validation.enabled=true
security.origin-validation.strict-mode=false
security.allowed-origins=${CORS_ALLOWED_ORIGINS:https://perundhu-frontend-preprod-1032721240281.asia-south1.run.app}

# Honeypot - Enabled
security.honeypot.enabled=true

# ============================================
# DATA ENCRYPTION CONFIGURATION (Preprod)
# ============================================
security.data.encryption.enabled=true
security.data.encryption.key=${sm://preprod-data-encryption-key}

# ============================================
# ADVANCED SECURITY FEATURES (PreProd)
# ============================================
# IP filtering
security.ip-filtering.enabled=true
security.ip-filtering.block-suspicious-agents=true
security.ip-filtering.max-requests-per-second=5
security.ip-filtering.max-unique-endpoints=15

# Data protection
security.data.obfuscate-for-non-premium=false
security.data.encrypt-sensitive-endpoints=true
security.data.log-access-attempts=true

# Security monitoring
security.monitoring.enabled=true
security.monitoring.alert-threshold=50
security.monitoring.block-after-violations=3

# Audit logging
security.audit.enabled=true
security.audit.log-file=logs/security-audit.log
security.audit.retention-days=30

# Anti-scraping measures
security.anti-scraping.enabled=true
security.anti-scraping.max-pages-per-session=100
security.anti-scraping.block-automated-tools=true

# ============================================
# reCAPTCHA CONFIGURATION (from GCP Secret Manager)
# ============================================
recaptcha.enabled=true
recaptcha.project-id=${GCP_PROJECT_ID:astute-strategy-406601}
recaptcha.site-key=${sm://recaptcha-site-key}
recaptcha.secret-key=${sm://recaptcha-secret-key}
recaptcha.min-score=0.5
recaptcha.max-age-seconds=120

# ============================================
# JWT CONFIGURATION (Preprod)
# ============================================
# JWT Secret from GCP Secret Manager (used by JwtTokenProvider)
app.jwtSecret=${sm://preprod-jwt-secret}
app.jwtExpirationInMs=${JWT_EXPIRATION:86400000}

# Additional JWT configuration
security.jwt.algorithm=HS512
security.jwt.issuer=${JWT_ISSUER:perundhu-api}
security.jwt.subject=${JWT_SUBJECT:perundhu-user}
security.jwt.audience=${JWT_AUDIENCE:perundhu-app}
security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# API Key - Disabled for preprod (enable when ready)
security.api-key.enabled=false

# ============================================
# ADMIN AUTHENTICATION
# ============================================
admin.auth.enabled=true
admin.auth.username=${sm://admin-username}
admin.auth.password=${sm://admin-password}