# PreProd Environment Configuration with MySQL on GCP
# ============================================
# ENVIRONMENT VARIABLE BASED CONFIGURATION
# ============================================
# Secrets are passed via Cloud Run --set-secrets flag as environment variables
# This avoids the need for Secret Manager client library and native SSL issues

# Disable Secret Manager auto-configuration to avoid native library crashes
spring.cloud.gcp.secretmanager.enabled=false

# Cloud SQL on GCP - Unix Socket Connection
# Uses Cloud SQL Proxy Unix socket for secure connectivity from Cloud Run
# When deployed to Cloud Run with --add-cloudsql-instances:
#   - GCP injects Cloud SQL Proxy sidecar automatically
#   - Socket created at: /cloudsql/PROJECT:REGION:INSTANCE
#   - SocketFactory automatically finds and uses the socket
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql:///perundhu?socketFactory=com.google.cloud.sql.mysql.SocketFactory&cloudSqlInstance=astute-strategy-406601:asia-south1:perundhu-preprod-mysql&connectTimeout=60000&socketTimeout=120000&autocommit=false}
spring.datasource.username=${DB_USERNAME:${MYSQL_USERNAME:perundhu_user}}
spring.datasource.password=${DB_PASSWORD:${MYSQL_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# READ REPLICA DATASOURCE (Optional - for testing)
# ============================================
# Disabled by default in preprod
# Enable when testing read/write splitting before production deployment

spring.datasource.replica.enabled=${READ_REPLICA_ENABLED:false}
spring.datasource.replica.url=${REPLICA_DATASOURCE_URL:${SPRING_DATASOURCE_URL:jdbc:mysql:///perundhu?socketFactory=com.google.cloud.sql.mysql.SocketFactory&cloudSqlInstance=astute-strategy-406601:asia-south1:perundhu-preprod-mysql-replica&connectTimeout=60000&socketTimeout=120000}}
spring.datasource.replica.username=${DB_USERNAME:${MYSQL_USERNAME:perundhu_user}}
spring.datasource.replica.password=${DB_PASSWORD:${MYSQL_PASSWORD:}}
spring.datasource.replica.driver-class-name=com.mysql.cj.jdbc.Driver

# Replica connection pool (smaller for preprod)
spring.datasource.replica.hikari.maximum-pool-size=${REPLICA_HIKARI_MAX_POOL_SIZE:5}
spring.datasource.replica.hikari.minimum-idle=${REPLICA_HIKARI_MIN_IDLE:1}
spring.datasource.replica.hikari.connection-timeout=${REPLICA_HIKARI_TIMEOUT:30000}
spring.datasource.replica.hikari.idle-timeout=60000
spring.datasource.replica.hikari.max-lifetime=300000
spring.datasource.replica.hikari.connection-test-query=SELECT 1
spring.datasource.replica.hikari.validation-timeout=5000

# Connection pool configuration with longer timeouts for migrations
# COST OPTIMIZATION: Optimized pool size for preprod with connection validation
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:8}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${HIKARI_TIMEOUT:45000}
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.pool-name=PerundhuPreprodHikariCP

# Connection validation - test connections before using them
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=5000

# Disable leak detection in preprod (monitoring overhead)
# Uncomment to enable if needed for debugging
# spring.datasource.hikari.leak-detection-threshold=0

# Lazy initialize connection pool to avoid connection errors on startup
spring.datasource.hikari.initialization-fail-timeout=0

# Lazy connection initialization - do not connect until first query
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.defer-datasource-initialization=true

# Multipart file upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
spring.servlet.multipart.enabled=true

# Flyway configuration for pre-production
# DISABLED on startup to allow container to start without DB connectivity
# Migrations are run separately via the CD pipeline before deployment
# To enable: set FLYWAY_ENABLED=true as environment variable
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=filesystem:app/src/main/resources/db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true
spring.flyway.connect-retries=5
spring.flyway.schemas=perundhu
spring.flyway.encoding=UTF-8

# Hibernate configuration for MySQL
# DDL set to 'none' - schema is managed by Flyway migrations
# Set to 'none' to avoid validation errors on startup when DB is initializing
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Hibernate connection pooling and retry settings
spring.jpa.properties.hibernate.connection.release_mode=after_transaction
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=true

# Connection validation at Hibernate level
spring.jpa.properties.hibernate.dialect.storage_engine=innodb
spring.jpa.properties.hibernate.format_sql=false

# COST OPTIMIZATION: Reduced batch sizes for lower memory usage in preprod
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.jdbc.fetch_size=25
spring.jpa.properties.hibernate.generate_statistics=false

# COST OPTIMIZATION: Reduced cache sizes (~30MB memory savings)
spring.jpa.properties.hibernate.query.plan_cache_max_size=512
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=64

# Server configuration
server.port=${SERVER_PORT:8080}

# File storage configuration for PreProd
app.file.base-url=${APP_FILE_BASE_URL:https://perundhu-backend-preprod-c6qn3mz4wa-el.a.run.app}

# CORS Configuration for PreProd (allow both frontend Cloud Run URL formats)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://perundhu-frontend-preprod-1032721240281.asia-south1.run.app,https://perundhu-frontend-preprod-c6qn3mz4wa-el.a.run.app}

# Logging with traceId for request tracking in Cloud Run
# COST OPTIMIZATION: Reduced logging in preprod
logging.level.root=${LOG_LEVEL_ROOT:WARN}
logging.level.com.perundhu=${LOG_LEVEL_APP:INFO}
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Disable JPA SQL logging in preprod
spring.jpa.show-sql=false

# Cloud Run logging pattern - JSON-friendly with traceId
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId:-NO_TRACE}] [%X{clientIp:-}] [%thread] %-5level %logger{36} - %msg%n

# ============================================
# PREPROD SECURITY CONFIGURATION
# ============================================
# Rate Limiting - Enabled with moderate limits
rate-limit.enabled=true
rate-limit.read.requests-per-minute=100
rate-limit.write.requests-per-minute=20
rate-limit.upload.requests-per-minute=10

# Origin Validation - Enabled, non-strict mode for testing
security.origin-validation.enabled=true
security.origin-validation.strict-mode=false
security.allowed-origins=${CORS_ALLOWED_ORIGINS:https://perundhu-frontend-preprod-1032721240281.asia-south1.run.app,https://perundhu-frontend-preprod-c6qn3mz4wa-el.a.run.app}

# Honeypot - Enabled
security.honeypot.enabled=true

# ============================================
# DATA ENCRYPTION CONFIGURATION (Preprod)
# ============================================
security.data.encryption.enabled=${DATA_ENCRYPTION_ENABLED:false}
security.data.encryption.key=${DATA_ENCRYPTION_KEY:}

# ============================================
# ADVANCED SECURITY FEATURES (PreProd)
# ============================================
# IP filtering
security.ip-filtering.enabled=true
security.ip-filtering.block-suspicious-agents=true
security.ip-filtering.max-requests-per-second=5
security.ip-filtering.max-unique-endpoints=15

# Data protection
security.data.obfuscate-for-non-premium=false
security.data.encrypt-sensitive-endpoints=true
security.data.log-access-attempts=true

# Security monitoring
security.monitoring.enabled=true
security.monitoring.alert-threshold=50
security.monitoring.block-after-violations=3

# Audit logging
security.audit.enabled=true
security.audit.log-file=logs/security-audit.log
security.audit.retention-days=30

# Anti-scraping measures
security.anti-scraping.enabled=true
security.anti-scraping.max-pages-per-session=100
security.anti-scraping.block-automated-tools=true

# ============================================
# reCAPTCHA CONFIGURATION (from Environment Variables)
# ============================================
# reCAPTCHA disabled for preprod to simplify admin authentication
# Admin login uses strong credentials and is protected by other security measures
recaptcha.enabled=false
recaptcha.project-id=${GCP_PROJECT_ID:astute-strategy-406601}
recaptcha.site-key=${RECAPTCHA_SITE_KEY:}
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}
recaptcha.min-score=0.5
recaptcha.max-age-seconds=120
recaptcha.action=submit

# ============================================
# JWT CONFIGURATION (Preprod)
# ============================================
# JWT Secret from environment variable (passed via Cloud Run)
app.jwtSecret=${JWT_SECRET:perundhu-default-jwt-key-preprod-CHANGE-IN-PRODUCTION}
app.jwtExpirationInMs=${JWT_EXPIRATION:86400000}

# Additional JWT configuration
security.jwt.algorithm=HS512
security.jwt.issuer=${JWT_ISSUER:perundhu-api}
security.jwt.subject=${JWT_SUBJECT:perundhu-user}
security.jwt.audience=${JWT_AUDIENCE:perundhu-app}
security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# API Key - Disabled for preprod (enable when ready)
security.api-key.enabled=false

# ============================================
# ADMIN AUTHENTICATION
# ============================================
admin.auth.enabled=true
admin.auth.username=${ADMIN_USERNAME:admin}
admin.auth.password=${ADMIN_PASSWORD:password}