# Production Environment Configuration
# ============================================
# GCP SECRET MANAGER INTEGRATION
# ============================================
# Secrets are injected via Cloud Run --set-secrets flag as environment variables
# Secret Manager ${sm://} syntax is disabled due to native library conflicts

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# READ REPLICA DATASOURCE (100k users scale)
# ============================================
# Enable read/write splitting for horizontal scaling
# Routes 80% of traffic (reads) to replica, 20% (writes) to primary
# Cost savings: ~$40-180/month vs scaling primary instance

spring.datasource.replica.enabled=${READ_REPLICA_ENABLED:false}
spring.datasource.replica.url=${DB_REPLICA_URL:${DB_URL}}
spring.datasource.replica.username=${DB_USERNAME}
spring.datasource.replica.password=${DB_PASSWORD}
spring.datasource.replica.driver-class-name=com.mysql.cj.jdbc.Driver

# Replica connection pool (optimized for read-heavy workload)
# COST OPTIMIZATION: Reduced for db-f1-micro instance limits
spring.datasource.replica.hikari.maximum-pool-size=${REPLICA_HIKARI_MAX_POOL_SIZE:8}
spring.datasource.replica.hikari.minimum-idle=${REPLICA_HIKARI_MIN_IDLE:1}
spring.datasource.replica.hikari.connection-timeout=${REPLICA_HIKARI_TIMEOUT:20000}
spring.datasource.replica.hikari.idle-timeout=300000
spring.datasource.replica.hikari.pool-name=PerundhuReplicaHikariCP
spring.datasource.replica.hikari.connection-test-query=SELECT 1
spring.datasource.replica.hikari.validation-timeout=5000
spring.datasource.replica.hikari.max-lifetime=300000
spring.datasource.replica.hikari.leak-detection-threshold=60000

# ============================================
# JAVA 21 VIRTUAL THREADS CONFIGURATION (Production)
# ============================================
# Enable virtual threads for massive scalability with simple blocking code
spring.threads.virtual.enabled=true

# Async Configuration with Virtual Threads
spring.task.execution.pool.core-size=0
spring.task.execution.pool.max-size=2000
spring.task.execution.pool.queue-capacity=50000
spring.task.execution.thread-name-prefix=async-vt-

# Scheduler Configuration with Virtual Threads
spring.task.scheduling.pool.size=20
spring.task.scheduling.thread-name-prefix=scheduled-vt-

# JFR Configuration (Flight Recorder) for Production Monitoring
jdk.jfr.enabled=true
com.oracle.jdk.jfr.startflightrecording=settings=profile,filename=/var/log/jfr/app-recording.jfr,delay=0s,duration=0s
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
spring.servlet.multipart.enabled=true

# Flyway configuration for production
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=true

# Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable schema validation to prevent circular dependency with Flyway
spring.jpa.properties.hibernate.validator.apply_to_ddl=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Let Flyway handle all schema management
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# Connection lifecycle management (prevents stale connections)
spring.jpa.properties.hibernate.connection.release_mode=after_transaction
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=true

# Connection pool configuration
# COST OPTIMIZATION: Sized for db-f1-micro (0.6GB RAM, ~50 max connections)
# With Cloud Run 0-5 instances: 5 × 10 = 50 total connections (safe limit)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${HIKARI_TIMEOUT:20000}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=PerundhuProductionHikariCP
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.leak-detection-threshold=60000
# Disable SQL profiling in production — base application.properties enables it for dev only
spring.datasource.hikari.data-source-properties.profileSQL=false
spring.datasource.hikari.data-source-properties.slowQueryThresholdMillis=0

# ============================================
# HIBERNATE PERFORMANCE OPTIMIZATIONS (Production)
# ============================================
# Batch processing - reduces round trips for bulk operations
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# Fetch size optimization
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# Query plan cache (for prepared statements)
spring.jpa.properties.hibernate.query.plan_cache_max_size=2048
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=128

# ============================================
# CACHE CONFIGURATION (Production with larger sizes)
# ============================================
# Caffeine cache with expanded size for production
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100000,expireAfterWrite=2h,refreshAfterWrite=1h

# ============================================
# RESPONSE COMPRESSION
# ============================================
# Enable gzip compression for API responses (70-80% reduction)
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# Server configuration
server.port=${SERVER_PORT:8080}

# Logging - Production settings
logging.level.root=${LOG_LEVEL_ROOT:WARN}
logging.level.com.perundhu=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=INFO
logging.level.org.flywaydb=INFO

# Log file configuration
logging.file.name=logs/perundhu-production.log
logging.file.max-size=10MB
logging.file.max-history=30

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://perundhu.com,https://www.perundhu.com,https://perundhu-production-frontend-202290873942.us-central1.run.app}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
cors.max-age=${CORS_MAX_AGE:3600}

# Security settings (Secrets from GCP Secret Manager)
security.require-ssl=${REQUIRE_SSL:true}

# Origin Validation Filter Configuration
# Allow requests from our domain and direct Cloud Run URL
# This validates the Origin/Referer headers to prevent unauthorized API access
security.allowed-origins=${SECURITY_ALLOWED_ORIGINS:https://perundhu.com,https://www.perundhu.com,https://perundhu-production-frontend-202290873942.us-central1.run.app}
security.origin-validation.enabled=${ORIGIN_VALIDATION_ENABLED:true}
security.origin-validation.strict-mode=${ORIGIN_VALIDATION_STRICT_MODE:false}

# ============================================
# JWT CONFIGURATION (Production)
# ============================================
# JWT Secret from GCP Secret Manager (used by JwtTokenProvider)
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationInMs=${JWT_EXPIRATION:86400000}

# Additional JWT configuration
security.jwt.algorithm=HS512
security.jwt.issuer=${JWT_ISSUER:perundhu-api}
security.jwt.subject=${JWT_SUBJECT:perundhu-user}
security.jwt.audience=${JWT_AUDIENCE:perundhu-app}
security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# OAuth2 Resource Server Configuration (if using OAuth2)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:}
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCES:perundhu-api}

# Session management (stateless for JWT)
server.servlet.session.persistent=false

# Enhanced Security Configuration (Encryption key from GCP Secret Manager)
security.api.rate-limit.enabled=true
security.ip-filtering.enabled=true
security.data.encryption.enabled=true
security.data.encryption.key=${SECURITY_DATA_ENCRYPTION_KEY}

# Rate limiting configuration
security.rate-limit.public-endpoints=30
security.rate-limit.authenticated-users=300
security.rate-limit.premium-users=1000
security.rate-limit.admin-users=5000

# IP filtering configuration  
security.ip-filtering.block-suspicious-agents=true
security.ip-filtering.block-private-networks=false
security.ip-filtering.max-requests-per-second=10
security.ip-filtering.max-unique-endpoints=20

# Data protection settings
security.data.obfuscate-for-non-premium=true
security.data.encrypt-sensitive-endpoints=true
security.data.log-access-attempts=true

# Security monitoring
security.monitoring.enabled=true
security.monitoring.alert-threshold=100
security.monitoring.block-after-violations=5

# ============================================
# ADMIN AUTHENTICATION (from GCP Secret Manager)
# ============================================
admin.auth.enabled=true
admin.auth.username=${ADMIN_USERNAME}
admin.auth.password=${ADMIN_PASSWORD}

# Audit logging
security.audit.enabled=true
security.audit.log-file=logs/security-audit.log
security.audit.retention-days=90

# Anti-scraping measures
security.anti-scraping.enabled=true
security.anti-scraping.max-pages-per-session=50
security.anti-scraping.block-automated-tools=true

# Session security
security.session.timeout-minutes=30
security.session.max-concurrent-sessions=3
security.session.invalidate-on-suspicious-activity=true

# Feature flags
feature.rewards.enabled=true

# ============================================
# reCAPTCHA CONFIGURATION (Shared secrets from GCP Secret Manager)
# ============================================
recaptcha.enabled=false
recaptcha.site-key=${RECAPTCHA_SITE_KEY}
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY}
recaptcha.score-threshold=0.5

# Automatic Approval Configuration
perundhu.automatic-approval.enabled=true
perundhu.automatic-approval.daily-limit=100
perundhu.automatic-approval.trusted-contributors=${TRUSTED_CONTRIBUTORS:admin}
perundhu.automatic-approval.min-confidence-score=0.9

# Disable Google Cloud SQL auto-configuration
spring.cloud.gcp.sql.enabled=false
spring.autoconfigure.exclude=com.google.cloud.spring.autoconfigure.sql.GcpCloudSqlAutoConfiguration

# Allow bean definition overriding
spring.main.allow-bean-definition-overriding=true

# ============================================
# SPRING BOOT ACTUATOR CONFIGURATION (Production)
# ============================================
# Enable health endpoint for monitoring
management.endpoints.web.exposure.include=health,info,circuitbreakers,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# PHASE 2 OPTIMIZATION: Enable performance metrics and monitoring
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Health indicator configuration
management.health.circuitbreakers.enabled=true
management.health.db.enabled=true
management.health.diskspace.enabled=true

# Kubernetes/Cloud Run health probes
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# ============================================
# TESSERACT OCR CONFIGURATION
# ============================================
# Parent directory of tessdata/ — set to match Ubuntu Jammy package install path.
# Tess4J's setDatapath() expects the *parent* of the tessdata directory.
# On Ubuntu 22.04 with tesseract-ocr-eng/tesseract-ocr-tam installed via apt,
# the traineddata files are at /usr/share/tesseract-ocr/4.00/tessdata/*.traineddata
app.tesseract.datapath=/usr/share/tesseract-ocr/4.00
