# ============================================
# RESILIENCE4J CONFIGURATION - PREPROD OVERRIDES
# ============================================
# COST OPTIMIZATION: Reduced sliding windows to minimize monitoring overhead

# Circuit Breaker for Gemini Vision API (preprod)
resilience4j.circuitbreaker.instances.gemini.slidingWindowSize=5
resilience4j.circuitbreaker.instances.gemini.minimumNumberOfCalls=3

# Circuit Breaker for OpenStreetMap/Nominatim API (preprod)
resilience4j.circuitbreaker.instances.osm.slidingWindowSize=5
resilience4j.circuitbreaker.instances.osm.minimumNumberOfCalls=3

# Circuit Breaker for reCAPTCHA (preprod)
resilience4j.circuitbreaker.instances.recaptcha.slidingWindowSize=5
resilience4j.circuitbreaker.instances.recaptcha.minimumNumberOfCalls=2
