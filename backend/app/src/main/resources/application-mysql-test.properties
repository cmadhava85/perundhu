# Local MySQL Testing Profile
# This profile is used for running Flyway migrations locally against MySQL 8.0
# to verify all migration scripts work correctly before deploying to preprod

spring.datasource.url=jdbc:mysql://localhost:3306/perundhu?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=perundhu_user
spring.datasource.password=perundhu_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway configuration for local MySQL testing
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true

# Hibernate configuration for MySQL 8.0
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Connection pool configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Server configuration
server.port=8080

# Disable security for local testing
security.api.rate-limit.enabled=false
security.ip-filtering.enabled=false
security.monitoring.enabled=false
security.anti-scraping.enabled=false

# Logging for MySQL testing
logging.level.root=INFO
logging.level.com.perundhu=DEBUG
logging.level.org.flywaydb=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
