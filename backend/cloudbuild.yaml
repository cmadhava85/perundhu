steps:
  # Step 1: Build the backend JAR
  - name: 'gradle:8-jdk21'
    entrypoint: bash
    args:
      - -c
      - |
        cd backend
        chmod +x gradlew
        ./gradlew clean build -x test --no-daemon
    id: 'build-jar'

  # Step 2: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - --no-cache
      - -t
      - '${_IMAGE}'
      - -t
      - '${_IMAGE_LATEST}'
      - ./backend
    id: 'build-image'

  # Step 3: Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '${_IMAGE}'
    id: 'push-image'

  # Step 4: Push the latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '${_IMAGE_LATEST}'
    id: 'push-latest'

images:
  - '${_IMAGE}'
  - '${_IMAGE_LATEST}'

options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  
substitutions:
  _IMAGE: 'asia-south1-docker.pkg.dev/astute-strategy-406601/perundhu/backend:latest'
  _IMAGE_LATEST: 'asia-south1-docker.pkg.dev/astute-strategy-406601/perundhu/backend:preprod-latest'

timeout: '1800s'
