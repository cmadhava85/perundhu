# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties

# Build Performance Optimizations
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true

# Daemon Settings - Keep gradle running in background for faster builds
org.gradle.daemon=true
org.gradle.daemon.idletimeout=60000

# Memory Settings - Increase heap for faster compilation
org.gradle.jvmargs=-Xmx2g -XX:+HeapDumpOnOutOfMemoryError

# Dependency Resolution Optimization
org.gradle.vfs.watch=true

# Use network offline when stable
# org.gradle.offline=false