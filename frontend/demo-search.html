<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perundhu - Search Buses (Demo)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0EA5E9;
            --primary-dark: #0284C7;
            --secondary: #10B981;
            --text-primary: #1F2937;
            --text-secondary: #6B7280;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.25);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.15);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Animated background particles */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            top: -150px;
            right: -150px;
            animation: float 8s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -200px;
            left: -200px;
            animation: float 10s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20px, -20px) scale(1.1); }
        }

        .container {
            max-width: 500px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* Glass card */
        .search-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 40px;
            transition: var(--transition);
        }

        .search-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.2);
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 12px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 15px;
        }

        /* Search form */
        .search-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            position: relative;
        }

        .input-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.95);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-icon {
            font-size: 18px;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid transparent;
            border-radius: 12px;
            font-size: 16px;
            color: var(--text-primary);
            transition: var(--transition);
            outline: none;
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.2);
            transform: scale(1.02);
        }

        /* Swap button */
        .swap-button {
            align-self: center;
            width: 44px;
            height: 44px;
            background: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            margin: -10px 0;
        }

        .swap-button:hover {
            transform: rotate(180deg) scale(1.1);
            box-shadow: var(--shadow-lg);
        }

        .swap-button:active {
            transform: rotate(180deg) scale(0.95);
        }

        /* Search button */
        .search-button {
            width: 100%;
            padding: 18px 32px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
            position: relative;
            overflow: hidden;
        }

        .search-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .search-button:hover::before {
            left: 100%;
        }

        .search-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(14, 165, 233, 0.4);
        }

        .search-button:active {
            transform: translateY(0);
        }

        /* Quick filters */
        .quick-filters {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .quick-filters-title {
            color: rgba(255, 255, 255, 0.9);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-chip {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            color: white;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }

        .filter-chip:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .filter-chip.active {
            background: var(--secondary);
            border-color: var(--secondary);
            font-weight: 600;
        }

        /* Recent searches */
        .recent-searches {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .recent-title {
            color: rgba(255, 255, 255, 0.9);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .recent-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 8px;
        }

        .recent-item:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(4px);
        }

        .recent-icon {
            font-size: 16px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .search-card {
                padding: 28px 24px;
            }

            .title {
                font-size: 24px;
            }

            .subtitle {
                font-size: 14px;
            }
        }

        /* Loading state */
        .search-button.loading {
            pointer-events: none;
        }

        .search-button.loading::after {
            content: '';
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="search-card">
            <div class="header">
                <div class="logo">🚌</div>
                <h1 class="title">Perundhu</h1>
                <p class="subtitle">Find your bus across Tamil Nadu</p>
            </div>

            <form class="search-form" onsubmit="handleSearch(event)">
                <div class="input-group">
                    <label class="input-label">
                        <span class="input-icon">📍</span>
                        <span>From</span>
                    </label>
                    <input 
                        type="text" 
                        class="search-input" 
                        placeholder="e.g., Chennai"
                        id="fromLocation"
                        autocomplete="off"
                    >
                </div>

                <button type="button" class="swap-button" onclick="swapLocations()">
                    ⇅
                </button>

                <div class="input-group">
                    <label class="input-label">
                        <span class="input-icon">📍</span>
                        <span>To</span>
                    </label>
                    <input 
                        type="text" 
                        class="search-input" 
                        placeholder="e.g., Madurai"
                        id="toLocation"
                        autocomplete="off"
                    >
                </div>

                <button type="submit" class="search-button">
                    <span>🔍</span>
                    <span>Search Buses</span>
                </button>
            </form>

            <div class="quick-filters">
                <div class="quick-filters-title">🚀 Quick Filters</div>
                <div class="filter-chips">
                    <span class="filter-chip">AC Buses</span>
                    <span class="filter-chip">Express</span>
                    <span class="filter-chip">Night Service</span>
                    <span class="filter-chip active">All Buses</span>
                </div>
            </div>

            <div class="recent-searches">
                <div class="recent-title">
                    <span>🕒</span>
                    <span>Recent Searches</span>
                </div>
                <div class="recent-item" onclick="fillSearch('Chennai', 'Coimbatore')">
                    <span class="recent-icon">📍</span>
                    <span>Chennai → Coimbatore</span>
                </div>
                <div class="recent-item" onclick="fillSearch('Salem', 'Madurai')">
                    <span class="recent-icon">📍</span>
                    <span>Salem → Madurai</span>
                </div>
                <div class="recent-item" onclick="fillSearch('Trichy', 'Chennai')">
                    <span class="recent-icon">📍</span>
                    <span>Trichy → Chennai</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function swapLocations() {
            const from = document.getElementById('fromLocation');
            const to = document.getElementById('toLocation');
            const temp = from.value;
            from.value = to.value;
            to.value = temp;
        }

        function fillSearch(from, to) {
            document.getElementById('fromLocation').value = from;
            document.getElementById('toLocation').value = to;
        }

        function handleSearch(e) {
            e.preventDefault();
            const button = e.target.querySelector('.search-button');
            button.classList.add('loading');
            button.innerHTML = '<span>Searching...</span>';
            
            setTimeout(() => {
                window.location.href = 'demo-results.html';
            }, 1500);
        }

        // Add filter chip interaction
        document.querySelectorAll('.filter-chip').forEach(chip => {
            chip.addEventListener('click', function() {
                document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // Add input focus animations
        document.querySelectorAll('.search-input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'scale(1.02)';
            });
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });
        });
    </script>
</body>
</html>
