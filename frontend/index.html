    <title>Perundhu - Tamil Nadu Bus Routes, Timings &amp; Schedules</title>

    <!-- Structured Data - WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Perundhu",
      "url": "https://www.perundhu.com",
      "description": "Find Tamil Nadu bus routes, timings and schedules for TNSTC, MTC and SETC buses across Tamil Nadu.",
      "inLanguage": ["en", "ta"],
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.perundhu.com/?from={from}&to={to}"
        },
        "query-input": "required name=from required name=to"
      }
    }
    </script>
    
    <!-- Google Analytics 4 -->
    <!-- TODO: Replace G-XXXXXXXXXX with your actual GA4 Measurement ID -->
    <!-- Get it from: https://analytics.google.com/analytics/web/ -> Admin -> Data Streams -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX', {
        'send_page_view': true,
        'anonymize_ip': true
      });
    </script>
    
    <!-- Google AdSense is loaded dynamically by GoogleAdContainer when ads are enabled -->
    <!-- reCAPTCHA Enterprise API (loaded dynamically by recaptchaService when enabled) -->
    
    <!-- PWA Splash Screen Styling -->
    <style>
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, #0EA5E9 0%, #0284C7 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      
      #splash-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      .splash-logo {
        width: 120px;
        height: 120px;
        margin-bottom: 32px;
        animation: splash-pulse 2s ease-in-out infinite;
        filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.15));
      }
      
      @keyframes splash-pulse {
        0%, 100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.85;
          transform: scale(0.95);
        }
      }
      
      .splash-title {
        color: white;
        font-size: 32px;
        font-weight: 700;
        margin-bottom: 8px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      
      .splash-tagline {
        color: rgba(255, 255, 255, 0.9);
        font-size: 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      }
      
      .splash-loader {
        margin-top: 40px;
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top-color: white;
        border-radius: 50%;
        animation: splash-spin 1s linear infinite;
      }
      
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
      
      @media (max-width: 600px) {
        .splash-logo {
          width: 100px;
          height: 100px;
        }
        
        .splash-title {
          font-size: 28px;
        }
        
        .splash-tagline {
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <!-- PWA Splash Screen -->
    <div id="splash-screen">
      <img src="/favicon.svg" alt="Perundhu" class="splash-logo" />
      <div class="splash-title">Perundhu</div>
      <div class="splash-tagline">Bus timings in seconds</div>
      <div class="splash-loader"></div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Hide splash screen when app loads -->
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          const splash = document.getElementById('splash-screen');
          if (splash) {
            splash.classList.add('hidden');
            setTimeout(function() {
              splash.remove();
            }, 300);
          }
        }, 500);
      });
    </script>
  </body>
</html>
