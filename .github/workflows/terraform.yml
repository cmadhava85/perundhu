name: Terraform Infrastructure

on:
  push:
    branches: [ main, master ]
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - preprod
          - production
        default: preprod
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan

# Cancel in-progress terraform runs
concurrency:
  group: terraform-${{ github.event.inputs.environment || 'auto' }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: '1.9'
  TF_WORKING_DIR: 'infrastructure/terraform/environments'
  # Environment configuration - values come from tfvars files
  ENVIRONMENTS: |
    {
      "preprod": {
        "project_id": "astute-strategy-406601",
        "tf_state_bucket": "astute-strategy-406601-tf-state",
        "tf_state_prefix": "preprod/state"
      },
      "production": {
        "project_id": "perundhu-prod-001",
        "tf_state_bucket": "perundhu-prod-001-tf-state-1767644488",
        "tf_state_prefix": "production/state"
      }
    }

jobs:
  terraform-validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
    
    - name: Terraform Format Check
      working-directory: ${{ env.TF_WORKING_DIR }}
      run: terraform fmt -check -recursive
      continue-on-error: true
    
    - name: Validate PreProd Config
      working-directory: ${{ env.TF_WORKING_DIR }}/preprod
      run: |
        terraform init -backend=false -lock=false
        terraform validate
    
    - name: Validate Production Config
      working-directory: ${{ env.TF_WORKING_DIR }}/production
      run: |
        terraform init -backend=false -lock=false
        terraform validate

  terraform-plan:
    name: Plan Terraform - ${{ matrix.environment }}
    runs-on: ubuntu-latest
    needs: [terraform-validate]
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'pull_request') ||
      (github.event_name == 'workflow_dispatch')
    
    strategy:
      matrix:
        include:
          - environment: preprod
            tf_dir: infrastructure/terraform/environments/preprod
            project_id: astute-strategy-406601
      max-parallel: 1
    
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    
    env:
      TF_ENV_DIR: ${{ matrix.tf_dir }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCPSECRET }}
        create_credentials_file: true
        export_environment_variables: true
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
    
    - name: Debug Environment Info
      run: |
        echo "Environment: ${{ matrix.environment }}"
        echo "Working Directory: ${{ env.TF_ENV_DIR }}"
        echo "Project ID: ${{ matrix.project_id }}"
        echo "GitHub Event: ${{ github.event_name }}"
    
    - name: Terraform Init
      working-directory: ${{ env.TF_ENV_DIR }}
      run: terraform init -input=false -reconfigure -lock=false
    
    - name: Terraform Plan
      id: plan
      working-directory: ${{ env.TF_ENV_DIR }}
      run: |
        # Use terraform.tfvars file from environment directory
        # No need to pass -var flags - tfvars file has all variables
        terraform plan -no-color -out=tfplan -lock=false
        terraform show -no-color tfplan > tfplan.txt
    
    - name: Upload Plan
      uses: actions/upload-artifact@v4
      with:
        name: terraform-plan-${{ matrix.environment }}
        path: ${{ env.TF_ENV_DIR }}/tfplan
        retention-days: 1
    
    - name: Comment Plan on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const path = require('path');
          const planFile = path.join('${{ env.TF_ENV_DIR }}', 'tfplan.txt');
          
          let planContent = 'Plan file not found';
          try {
            planContent = fs.readFileSync(planFile, 'utf8');
          } catch (error) {
            console.log('Error reading plan file:', error.message);
          }
          
          const truncatedPlan = planContent.length > 65000 ? planContent.substring(0, 65000) + '\n\n... (truncated)' : planContent;
          
          const output = `#### Terraform Plan 📋 \`${{ matrix.environment }}\`
          <details><summary>Show Plan</summary>

          \`\`\`terraform
          ${truncatedPlan}
          \`\`\`

          </details>

          *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          });

  terraform-plan-production:
    name: Plan Terraform - production
    runs-on: ubuntu-latest
    needs: [terraform-validate]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    
    env:
      TF_ENV_DIR: infrastructure/terraform/environments/production
    
    permissions:
      contents: read
      id-token: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCPSECRET }}
        create_credentials_file: true
        export_environment_variables: true
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
    
    - name: Debug Environment Info
      run: |
        echo "Environment: production"
        echo "Working Directory: ${{ env.TF_ENV_DIR }}"
        echo "Project ID: perundhu-prod-001"
        echo "GitHub Event: ${{ github.event_name }}"
    
    - name: Terraform Init
      working-directory: ${{ env.TF_ENV_DIR }}
      run: terraform init -input=false -reconfigure -lock=false
    
    - name: Terraform Plan
      id: plan
      working-directory: ${{ env.TF_ENV_DIR }}
      run: |
        terraform plan -no-color -out=tfplan -lock=false
        terraform show -no-color tfplan > tfplan.txt
    
    - name: Upload Plan
      uses: actions/upload-artifact@v4
      with:
        name: terraform-plan-production
        path: ${{ env.TF_ENV_DIR }}/tfplan
        retention-days: 1


  terraform-apply:
    name: Apply Terraform - ${{ matrix.environment }}
    runs-on: ubuntu-latest
    needs: [terraform-plan, terraform-plan-production]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' && 
      github.event.inputs.action == 'apply' &&
      github.event.inputs.environment == 'preprod' &&
      (needs.terraform-plan.result == 'success')) ||
      (github.event_name == 'workflow_dispatch' && 
      github.event.inputs.action == 'apply' &&
      github.event.inputs.environment == 'production' &&
      (needs.terraform-plan-production.result == 'success'))
    
    strategy:
      matrix:
        include:
          - environment: preprod
            tf_dir: infrastructure/terraform/environments/preprod
            project_id: astute-strategy-406601
            console_url: https://console.cloud.google.com/run?project=astute-strategy-406601
          - environment: production
            tf_dir: infrastructure/terraform/environments/production
            project_id: perundhu-prod-001
            console_url: https://console.cloud.google.com/run?project=perundhu-prod-001
      max-parallel: 1
    
    # Only run the selected environment
    environment:
      name: ${{ matrix.environment }}-infrastructure
      url: ${{ matrix.console_url }}
    
    permissions:
      contents: read
      id-token: write
    
    env:
      TF_ENV_DIR: ${{ matrix.tf_dir }}
    
    steps:
    - name: Check if environment matches selection
      id: env_check
      run: |
        if [ "${{ matrix.environment }}" != "${{ github.event.inputs.environment }}" ]; then
          echo "skip=true" >> $GITHUB_OUTPUT
          echo "Skipping ${{ matrix.environment }} (selected: ${{ github.event.inputs.environment }})"
        else
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "Running apply for ${{ matrix.environment }}"
        fi
    
    - uses: actions/checkout@v4
      if: steps.env_check.outputs.skip != 'true'
    
    - name: Authenticate to Google Cloud
      if: steps.env_check.outputs.skip != 'true'
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCPSECRET }}
        create_credentials_file: true
        export_environment_variables: true
    
    - name: Set up Cloud SDK
      if: steps.env_check.outputs.skip != 'true'
      uses: google-github-actions/setup-gcloud@v2
    
    - name: Setup Terraform
      if: steps.env_check.outputs.skip != 'true'
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
    
    - name: Terraform Init
      if: steps.env_check.outputs.skip != 'true'
      working-directory: ${{ env.TF_ENV_DIR }}
      run: terraform init -input=false
    
    - name: Download Plan
      if: steps.env_check.outputs.skip != 'true'
      uses: actions/download-artifact@v4
      with:
        name: terraform-plan-${{ matrix.environment }}
        path: ${{ env.TF_ENV_DIR }}
    
    - name: Verify Plan File
      if: steps.env_check.outputs.skip != 'true'
      working-directory: ${{ env.TF_ENV_DIR }}
      run: |
        if [ ! -f tfplan ]; then
          echo "ERROR: tfplan file not found in ${{ env.TF_ENV_DIR }}"
          exit 1
        fi
        echo "✓ Plan file verified"
    
    - name: Terraform Apply
      if: steps.env_check.outputs.skip != 'true'
      working-directory: ${{ env.TF_ENV_DIR }}
      run: terraform apply -auto-approve tfplan
    
    - name: Terraform Output
      if: steps.env_check.outputs.skip != 'true'
      id: output
      working-directory: ${{ env.TF_ENV_DIR }}
      run: |
        terraform output -json > outputs.json
        echo "Outputs saved"
    
    - name: Upload Terraform Outputs
      if: steps.env_check.outputs.skip != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: terraform-outputs-${{ matrix.environment }}
        path: ${{ env.TF_ENV_DIR }}/outputs.json
        retention-days: 1
    
    - name: Create Summary
      if: steps.env_check.outputs.skip != 'true'
      run: |
        echo "## ✅ ${{ matrix.environment }} Infrastructure Applied" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Environment**: ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Project**: ${{ matrix.project_id }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Applied by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Check [Cloud Console](${{ matrix.console_url }}) for resources" >> $GITHUB_STEP_SUMMARY

  terraform-destroy:
    name: Destroy Terraform - ${{ matrix.environment }}
    runs-on: ubuntu-latest
    needs: [terraform-plan, terraform-plan-production]
    if: |
      always() && (
        (github.event_name == 'workflow_dispatch' && 
        github.event.inputs.action == 'destroy' &&
        github.event.inputs.environment == 'preprod') ||
        (github.event_name == 'workflow_dispatch' && 
        github.event.inputs.action == 'destroy' &&
        github.event.inputs.environment == 'production')
      )
    
    strategy:
      matrix:
        include:
          - environment: preprod
            tf_dir: infrastructure/terraform/environments/preprod
            project_id: astute-strategy-406601
          - environment: production
            tf_dir: infrastructure/terraform/environments/production
            project_id: perundhu-prod-001
      max-parallel: 1
    
    environment:
      name: ${{ matrix.environment }}-infrastructure-destroy
    
    permissions:
      contents: read
      id-token: write
    
    env:
      TF_ENV_DIR: ${{ matrix.tf_dir }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCPSECRET }}
        create_credentials_file: true
        export_environment_variables: true
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
    
    - name: Terraform Init
      working-directory: ${{ env.TF_ENV_DIR }}
      run: terraform init -input=false
    
    - name: Terraform Destroy
      working-directory: ${{ env.TF_ENV_DIR }}
      run: terraform destroy -auto-approve -lock=false
    
    - name: Create Summary
      run: |
        echo "## ⚠️ ${{ matrix.environment }} Infrastructure Destroyed" >> $GITHUB_STEP_SUMMARY



