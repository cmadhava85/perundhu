name: Artifact Registry - Cleanup Old Images

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to clean'
        required: true
        type: choice
        options:
          - preprod
          - production
          - both
      keep_count:
        description: 'Number of recent images to keep'
        required: true
        default: '7'
        type: string
      dry_run:
        description: 'Dry run (show what would be deleted)'
        type: boolean
        default: true
  schedule:
    # Run twice daily at 2 AM EST (7:00 AM UTC)
    - cron: '0 7 * * *'
    # Run twice daily at 2 PM EST (7:00 PM UTC)
    - cron: '0 19 * * *'

env:
  PREPROD_PROJECT: astute-strategy-406601
  PROD_PROJECT: perundhu-prod-001
  REGIONS: us-central1,asia-south1  # Check both regions (before/after migration)
  REPO_NAME: perundhu

jobs:
  cleanup-preprod:
    name: Cleanup PreProd Artifacts
    if: github.event.inputs.environment == 'preprod' || github.event.inputs.environment == 'both' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to GCP (PreProd)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCPSECRET_PREPROD }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Check all regions for repositories
        id: discover-repos
        run: |
          echo "🔍 Discovering all artifact repositories..." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          TOTAL_SIZE_BYTES=0
          FOUND_REPOS=""
          
          # Check each region
          for REGION in us-central1 asia-south1; do
            echo "Checking region: $REGION"
            
            if gcloud artifacts repositories describe ${{ env.REPO_NAME }} \
              --project=${{ env.PREPROD_PROJECT }} \
              --location=$REGION &>/dev/null; then
              
              SIZE_BYTES=$(gcloud artifacts repositories describe ${{ env.REPO_NAME }} \
                --project=${{ env.PREPROD_PROJECT }} \
                --location=$REGION \
                --format="value(sizeBytes)" 2>/dev/null || echo "0")
              
              SIZE_GB=$(echo "scale=2; $SIZE_BYTES / 1024 / 1024 / 1024" | bc)
              
              echo "✅ Found in $REGION: ${SIZE_GB} GB" >> $GITHUB_STEP_SUMMARY
              
              TOTAL_SIZE_BYTES=$((TOTAL_SIZE_BYTES + SIZE_BYTES))
              FOUND_REPOS="$FOUND_REPOS $REGION"
            else
              echo "ℹ️  Not found in $REGION" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          TOTAL_SIZE_GB=$(echo "scale=2; $TOTAL_SIZE_BYTES / 1024 / 1024 / 1024" | bc)
          echo "total_size_gb=$TOTAL_SIZE_GB" >> $GITHUB_OUTPUT
          echo "found_regions=$FOUND_REPOS" >> $GITHUB_OUTPUT
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**TOTAL PreProd Storage: ${TOTAL_SIZE_GB} GB**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: List all images in all regions
        id: list-images
        run: |
          FOUND_REGIONS="${{ steps.discover-repos.outputs.found_regions }}"
          
          for REGION in $FOUND_REGIONS; do
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━" >> $GITHUB_STEP_SUMMARY
            echo "### Images in $REGION" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            gcloud artifacts docker images list \
              ${REGION}-docker.pkg.dev/${{ env.PREPROD_PROJECT }}/${{ env.REPO_NAME }} \
              --include-tags \
              --format="table(package,version,createTime)" \
              --sort-by="~createTime" \
              --limit=20 >> $GITHUB_STEP_SUMMARY 2>&1 || echo "No images" >> $GITHUB_STEP_SUMMARY
            
            echo "" >> $GITHUB_STEP_SUMMARY
          done

      - name: Cleanup old images (all regions)
        run: |
          KEEP_COUNT=${{ github.event.inputs.keep_count || '7' }}
          DRY_RUN=${{ github.event.inputs.dry_run || 'true' }}
          FOUND_REGIONS="${{ steps.discover-repos.outputs.found_regions }}"
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━" >> $GITHUB_STEP_SUMMARY
          echo "## 🧹 Cleanup Plan" >> $GITHUB_STEP_SUMMARY
          echo "Keep count: $KEEP_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "Dry run: $DRY_RUN" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          TOTAL_DELETED=0
          
          # Clean each region separately
          for REGION in $FOUND_REGIONS; do
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━" >> $GITHUB_STEP_SUMMARY
            echo "### Cleaning $REGION" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            IMAGES=$(gcloud artifacts docker images list \
              ${REGION}-docker.pkg.dev/${{ env.PREPROD_PROJECT }}/${{ env.REPO_NAME }} \
              --format="value(IMAGE)" \
              --sort-by="~createTime" 2>/dev/null || echo "")
            
            if [ -z "$IMAGES" ]; then
              echo "ℹ️  No images in $REGION" >> $GITHUB_STEP_SUMMARY
              continue
            fi
            
            TOTAL_COUNT=$(echo "$IMAGES" | wc -l | tr -d ' ')
            echo "Total images in $REGION: $TOTAL_COUNT" >> $GITHUB_STEP_SUMMARY
            
            if [ "$TOTAL_COUNT" -le "$KEEP_COUNT" ]; then
              echo "✅ Within limit ($KEEP_COUNT)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              continue
            fi
            
            DELETE_COUNT=$((TOTAL_COUNT - KEEP_COUNT))
            echo "To delete: $DELETE_COUNT images" >> $GITHUB_STEP_SUMMARY
            
            IMAGES_TO_DELETE=$(echo "$IMAGES" | tail -n +$((KEEP_COUNT + 1)))
            
            if [ "$DRY_RUN" = "true" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**DRY RUN** - Would delete:" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "$IMAGES_TO_DELETE" | head -10 >> $GITHUB_STEP_SUMMARY
              [ $DELETE_COUNT -gt 10 ] && echo "... and $((DELETE_COUNT - 10)) more" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            else
              DELETED=0
              while IFS= read -r IMAGE; do
                if gcloud artifacts docker images delete "$IMAGE" \
                  --project=${{ env.PREPROD_PROJECT }} \
                  --quiet 2>/dev/null; then
                  DELETED=$((DELETED + 1))
                fi
              done <<< "$IMAGES_TO_DELETE"
              
              echo "✅ Deleted $DELETED images from $REGION" >> $GITHUB_STEP_SUMMARY
              TOTAL_DELETED=$((TOTAL_DELETED + DELETED))
            fi
            
            echo "" >> $GITHUB_STEP_SUMMARY
          done
          
          if [ "$DRY_RUN" = "false" ]; then
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━" >> $GITHUB_STEP_SUMMARY
            echo "**Total deleted across all regions: $TOTAL_DELETED**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Get repository size (after cleanup)
        if: github.event.inputs.dry_run != 'true'
        run: |
          sleep 15  # Wait for cleanup to propagate
          
          FOUND_REGIONS="${{ steps.discover-repos.outputs.found_regions }}"
          TOTAL_SIZE_BYTES=0
          
          for REGION in $FOUND_REGIONS; do
            SIZE_BYTES=$(gcloud artifacts repositories describe ${{ env.REPO_NAME }} \
              --project=${{ env.PREPROD_PROJECT }} \
              --location=$REGION \
              --format="value(sizeBytes)" 2>/dev/null || echo "0")
            
            TOTAL_SIZE_BYTES=$((TOTAL_SIZE_BYTES + SIZE_BYTES))
          done
          
          TOTAL_SIZE_GB=$(echo "scale=2; $TOTAL_SIZE_BYTES / 1024 / 1024 / 1024" | bc)
          BEFORE_SIZE=${{ steps.discover-repos.outputs.total_size_gb }}
          SAVED=$(echo "scale=2; $BEFORE_SIZE - $TOTAL_SIZE_GB" | bc)
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Storage Impact" >> $GITHUB_STEP_SUMMARY
          echo "- **Before**: ${BEFORE_SIZE} GB" >> $GITHUB_STEP_SUMMARY
          echo "- **After**: ${TOTAL_SIZE_GB} GB" >> $GITHUB_STEP_SUMMARY
          echo "- **Saved**: ${SAVED} GB" >> $GITHUB_STEP_SUMMARY
          echo "- **Monthly Cost Reduction**: ~\$${SAVED}/month" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if echo "$SAVED > 10" | bc -l | grep -q 1; then
            echo "🎉 **Significant savings!** This should noticeably reduce your bill." >> $GITHUB_STEP_SUMMARY
          fi

  cleanup-production:
    name: Cleanup Production Artifacts
    if: github.event.inputs.environment == 'production' || github.event.inputs.environment == 'both'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to GCP (Production)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCPSECRET_PRODUCTION }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Get repository size (before)
        id: size-before
        run: |
          SIZE_BYTES=$(gcloud artifacts repositories describe ${{ env.REPO_NAME }} \
            --project=${{ env.PROD_PROJECT }} \
            --location=${{ env.REGION }} \
            --format="value(sizeBytes)" 2>/dev/null || echo "0")
          
          SIZE_GB=$(echo "scale=2; $SIZE_BYTES / 1024 / 1024 / 1024" | bc)
          echo "size_gb=$SIZE_GB" >> $GITHUB_OUTPUT
          
          echo "📦 Production Artifact Registry Size: ${SIZE_GB} GB" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup old images (production - keep 15)
        run: |
          # Production keeps more images for safety (15 instead of 7)
          KEEP_COUNT=15
          DRY_RUN=${{ github.event.inputs.dry_run || 'true' }}
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🧹 Cleaning Production Artifacts"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Keep count: $KEEP_COUNT (production keeps more for safety)"
          echo "Dry run: $DRY_RUN"
          echo ""
          
          IMAGES=$(gcloud artifacts docker images list \
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROD_PROJECT }}/${{ env.REPO_NAME }} \
            --format="value(IMAGE)" \
            --sort-by="~createTime" 2>/dev/null || echo "")
          
          if [ -z "$IMAGES" ]; then
            echo "ℹ️  No images found in repository"
            exit 0
          fi
          
          TOTAL_COUNT=$(echo "$IMAGES" | wc -l | tr -d ' ')
          echo "Total images: $TOTAL_COUNT"
          
          if [ "$TOTAL_COUNT" -le "$KEEP_COUNT" ]; then
            echo "✅ Image count ($TOTAL_COUNT) is within keep limit ($KEEP_COUNT)"
            exit 0
          fi
          
          DELETE_COUNT=$((TOTAL_COUNT - KEEP_COUNT))
          echo "Images to delete: $DELETE_COUNT"
          
          IMAGES_TO_DELETE=$(echo "$IMAGES" | tail -n +$((KEEP_COUNT + 1)))
          
          if [ "$DRY_RUN" = "true" ]; then
            echo "🔍 DRY RUN - Would delete these images:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$IMAGES_TO_DELETE" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "🗑️  Deleting old images..." >> $GITHUB_STEP_SUMMARY
            DELETED=0
            
            while IFS= read -r IMAGE; do
              echo "Deleting: $IMAGE"
              
              if gcloud artifacts docker images delete "$IMAGE" \
                --project=${{ env.PROD_PROJECT }} \
                --quiet 2>/dev/null; then
                DELETED=$((DELETED + 1))
                echo "  ✅ Deleted"
              else
                echo "  ⚠️  Failed"
              fi
            done <<< "$IMAGES_TO_DELETE"
            
            echo "✅ Deleted $DELETED images" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Get repository size (after)
        if: github.event.inputs.dry_run != 'true'
        run: |
          sleep 10
          
          SIZE_BYTES=$(gcloud artifacts repositories describe ${{ env.REPO_NAME }} \
            --project=${{ env.PROD_PROJECT }} \
            --location=${{ env.REGION }} \
            --format="value(sizeBytes)" 2>/dev/null || echo "0")
          
          SIZE_GB=$(echo "scale=2; $SIZE_BYTES / 1024 / 1024 / 1024" | bc)
          BEFORE_SIZE=${{ steps.size-before.outputs.size_gb }}
          SAVED=$(echo "scale=2; $BEFORE_SIZE - $SIZE_GB" | bc)
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 Storage Summary:" >> $GITHUB_STEP_SUMMARY
          echo "- Before: ${BEFORE_SIZE} GB" >> $GITHUB_STEP_SUMMARY
          echo "- After: ${SIZE_GB} GB" >> $GITHUB_STEP_SUMMARY
          echo "- Saved: ${SAVED} GB (~\$${SAVED}/month)" >> $GITHUB_STEP_SUMMARY
