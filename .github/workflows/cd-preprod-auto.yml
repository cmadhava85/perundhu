name: CD - Auto Deploy to Pre-Production

# Triggered after CI pipeline completes successfully or manually
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deploy_frontend:
        description: 'Deploy Frontend'
        type: boolean
        default: true
      deploy_backend:
        description: 'Deploy Backend'
        type: boolean
        default: true
      run_migrations:
        description: 'Run Database Migrations'
        type: boolean
        default: true

# Queue deployments instead of cancelling - let each deployment complete
concurrency:
  group: preprod-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: astute-strategy-406601
  GCP_REGION: asia-south1
  ARTIFACT_REGISTRY: asia-south1-docker.pkg.dev
  BACKEND_URL: "https://perundhu-backend-preprod-1032721240281.asia-south1.run.app"
  DB_INSTANCE: "astute-strategy-406601:asia-south1:perundhu-preprod-mysql-asia"
  DB_NAME: "perundhu"
  DB_PORT: "3306"

jobs:
  # Check if CI passed (skip this check for manual dispatch)
  check-ci-status:
    name: Check CI Status
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
    - name: Check CI workflow result
      id: check
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "✅ Manual dispatch - proceeding with deployment"
          echo "should_deploy=true" >> $GITHUB_OUTPUT
        elif [ "${{ github.event.workflow_run.conclusion }}" == "success" ]; then
          echo "✅ CI passed - proceeding with deployment"
          echo "should_deploy=true" >> $GITHUB_OUTPUT
        else
          echo "❌ CI did not succeed (status: ${{ github.event.workflow_run.conclusion }}) - skipping deployment"
          echo "should_deploy=false" >> $GITHUB_OUTPUT
        fi

  # Detect which services have changes
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    needs: [check-ci-status]
    if: needs.check-ci-status.outputs.should_deploy == 'true'
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}
      migrations: ${{ steps.changes.outputs.migrations }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
    
    - name: Detect changes
      id: changes
      run: |
        # For manual dispatch, use input values
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "frontend=${{ inputs.deploy_frontend }}" >> $GITHUB_OUTPUT
          echo "backend=${{ inputs.deploy_backend }}" >> $GITHUB_OUTPUT
          echo "migrations=${{ inputs.run_migrations }}" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        # For push events, detect changes from git diff
        CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD)
        
        # Check frontend changes
        if echo "$CHANGED_FILES" | grep -q "^frontend/"; then
          echo "frontend=true" >> $GITHUB_OUTPUT
          echo "📦 Frontend changes detected"
        else
          echo "frontend=false" >> $GITHUB_OUTPUT
        fi
        
        # Check backend changes
        if echo "$CHANGED_FILES" | grep -q "^backend/"; then
          echo "backend=true" >> $GITHUB_OUTPUT
          echo "📦 Backend changes detected"
        else
          echo "backend=false" >> $GITHUB_OUTPUT
        fi
        
        # Check for database migrations
        if echo "$CHANGED_FILES" | grep -q "^backend/.*migration"; then
          echo "migrations=true" >> $GITHUB_OUTPUT
          echo "📦 Database migrations detected"
        else
          echo "migrations=false" >> $GITHUB_OUTPUT
        fi
        
        echo "Changed files:"
        echo "$CHANGED_FILES"

  # Build and push Frontend (Docker image push only, actual build done by CI)
  build-frontend:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.frontend == 'true'
    outputs:
      image: ${{ steps.build.outputs.image }}
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
    
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCPSECRET }}
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
    
    - name: Configure Docker
      run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Build Frontend
      working-directory: ./frontend
      run: |
        npm ci
        npm run build
    
    - name: Build and Push Docker Image
      id: build
      run: |
        COMMIT_SHA=$(git rev-parse --short HEAD)
        TAG="$(date +%Y%m%d-%H%M%S)-${COMMIT_SHA}"
        IMAGE="${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/perundhu/frontend:${TAG}"
        
        # Get Google Maps API key from Secret Manager
        GOOGLE_MAPS_API_KEY=$(gcloud secrets versions access latest --secret=google-maps-api-key 2>/dev/null || echo "")
        
        # Create env file for Docker build
        cat > ./frontend/.env.production.local << EOF
        VITE_API_URL=${{ env.BACKEND_URL }}
        VITE_API_BASE_URL=${{ env.BACKEND_URL }}
        VITE_GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
        EOF
        
        echo "🔨 Building and pushing Frontend image..."
        docker build -t $IMAGE -t ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/perundhu/frontend:preprod-latest ./frontend
        docker push $IMAGE
        docker push ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/perundhu/frontend:preprod-latest
        
        echo "image=$IMAGE" >> $GITHUB_OUTPUT
        echo "✅ Frontend image pushed: $IMAGE"

  # Build and push Backend (Docker image push only, actual build done by CI)
  build-backend:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.backend == 'true'
    outputs:
      image: ${{ steps.build.outputs.image }}
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Build Backend JAR
      working-directory: ./backend
      run: |
        chmod +x gradlew
        ./gradlew build -x test
    
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCPSECRET }}
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
    
    - name: Configure Docker
      run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }}
    
    - name: Build and Push Docker Image
      id: build
      run: |
        COMMIT_SHA=$(git rev-parse --short HEAD)
        TAG="$(date +%Y%m%d-%H%M%S)-${COMMIT_SHA}"
        IMAGE="${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/perundhu/backend:${TAG}"
        
        echo "🔨 Building and pushing Backend image..."
        docker build -t $IMAGE -t ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/perundhu/backend:preprod-latest ./backend
        docker push $IMAGE
        docker push ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/perundhu/backend:preprod-latest
        
        echo "image=$IMAGE" >> $GITHUB_OUTPUT
        echo "✅ Backend image pushed: $IMAGE"

  # Run database migrations
  run-migrations:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.migrations == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCPSECRET }}
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
    
    - name: Install dependencies
      run: |
        echo "📦 Installing Cloud SQL Proxy and MySQL client..."
        sudo apt-get update -qq
        sudo apt-get install -y mysql-client
        
        # Download and install cloud-sql-proxy v2
        curl -o /tmp/cloud-sql-proxy https://dl.google.com/cloudsql/cloud-sql-proxy.linux.amd64
        chmod +x /tmp/cloud-sql-proxy
        sudo mv /tmp/cloud-sql-proxy /usr/local/bin/cloud-sql-proxy
        echo "✅ Dependencies installed"
    
    - name: Run Flyway Migrations
      working-directory: ./backend
      env:
        FLYWAY_URL: "jdbc:mysql://127.0.0.1:${{ env.DB_PORT }}/${{ env.DB_NAME }}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
        FLYWAY_USER: ${{ secrets.PREPROD_DB_USER }}
        FLYWAY_PASSWORD: ${{ secrets.PREPROD_DB_PASSWORD }}
      run: |
        set -e
        
        # Cleanup any stale proxy processes
        pkill -9 -f "cloud-sql-proxy" || true
        sleep 2
        
        echo "🚀 Starting Cloud SQL Proxy..."
        /usr/local/bin/cloud-sql-proxy \
          --port=${{ env.DB_PORT }} \
          ${{ env.DB_INSTANCE }} \
          > /tmp/sql_proxy.log 2>&1 &
        
        PROXY_PID=$!
        echo "Proxy PID: $PROXY_PID"
        
        # Wait for proxy to be ready
        echo "⏳ Waiting for proxy to start..."
        sleep 3
        
        # Check proxy is running
        if ! kill -0 $PROXY_PID 2>/dev/null; then
          echo "❌ Proxy failed to start"
          cat /tmp/sql_proxy.log
          exit 1
        fi
        
        # Wait for port to be available
        echo "🔌 Waiting for database port..."
        for i in {1..60}; do
          if timeout 1 bash -c "echo > /dev/tcp/127.0.0.1/${{ env.DB_PORT }}" 2>/dev/null; then
            echo "✅ Database port is ready"
            break
          fi
          if [ $i -eq 60 ]; then
            echo "❌ Database port timeout"
            cat /tmp/sql_proxy.log
            kill $PROXY_PID 2>/dev/null || true
            exit 1
          fi
          echo "Waiting... ($i/60)"
          sleep 1
        done
        
        # Test database connectivity
        echo "🧪 Testing database connection..."
        for i in {1..10}; do
          if mysql -h127.0.0.1 -P${{ env.DB_PORT }} -u"$FLYWAY_USER" -p"$FLYWAY_PASSWORD" -e "SELECT 1;" 2>/dev/null; then
            echo "✅ Database connection successful"
            break
          fi
          if [ $i -eq 10 ]; then
            echo "❌ Database connection failed"
            cat /tmp/sql_proxy.log
            kill $PROXY_PID 2>/dev/null || true
            exit 1
          fi
          echo "Retrying connection... ($i/10)"
          sleep 2
        done
        
        # Run migrations
        echo "🔄 Running Flyway migrations..."
        chmod +x gradlew
        
        trap "kill $PROXY_PID 2>/dev/null || true" EXIT
        
        if ./gradlew flywayMigrate --info 2>&1 | tee /tmp/migration.log; then
          echo "✅ Migrations completed successfully"
        else
          echo "❌ Migrations failed"
          echo "=== Migration Log ==="
          cat /tmp/migration.log
          exit 1
        fi

  # Deploy Frontend
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [detect-changes, build-frontend]
    if: always() && needs.detect-changes.outputs.frontend == 'true' && needs.build-frontend.result == 'success'
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCPSECRET }}
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
    
    - name: Deploy Frontend to Cloud Run
      run: |
        echo "🚀 Deploying Frontend..."
        gcloud run deploy perundhu-frontend-preprod \
          --image ${{ needs.build-frontend.outputs.image }} \
          --platform managed \
          --region ${{ env.GCP_REGION }} \
          --allow-unauthenticated \
          --set-env-vars="VITE_FEATURE_ADMIN=true" \
          --port 8080 \
          --memory 512Mi \
          --cpu 1 \
          --min-instances 0 \
          --max-instances 5 \
          --concurrency 80 \
          --timeout 60s \
          --cpu-throttling \
          --labels="env=preprod"
        echo "✅ Frontend deployed successfully"

  # Deploy Backend
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: [detect-changes, build-backend, run-migrations]
    if: always() && needs.detect-changes.outputs.backend == 'true' && needs.build-backend.result == 'success' && (needs.run-migrations.result == 'success' || needs.run-migrations.result == 'skipped')
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCPSECRET }}
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
    
    - name: Deploy Backend to Cloud Run
      run: |
        echo "🚀 Deploying Backend..."
        gcloud run deploy perundhu-backend-preprod \
          --image ${{ needs.build-backend.outputs.image }} \
          --platform managed \
          --region ${{ env.GCP_REGION }} \
          --allow-unauthenticated \
          --set-env-vars="SPRING_PROFILES_ACTIVE=preprod,GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }},GCP_INSTANCE_CONNECTION_NAME=${{ env.DB_INSTANCE }},MYSQL_USERNAME=perundhu_user,GEMINI_API_ENABLED=true,CORS_ALLOWED_ORIGINS=https://perundhu-frontend-preprod-1032721240281.asia-south1.run.app" \
          --set-secrets="DB_PASSWORD=preprod-db-password:latest,MYSQL_PASSWORD=preprod-db-password:latest,DB_USERNAME=preprod-db-username:latest,JWT_SECRET=preprod-jwt-secret:latest,DATA_ENCRYPTION_KEY=preprod-data-encryption-key:latest,GEMINI_API_KEY=gemini-api-key:latest,PUBLIC_API_KEY=PUBLIC_API_KEY:latest,RECAPTCHA_SITE_KEY=preprod-recaptcha-site-key:latest,RECAPTCHA_SECRET_KEY=preprod-recaptcha-secret-key:latest" \
          --add-cloudsql-instances=${{ env.DB_INSTANCE }} \
          --service-account=cloud-run-sa@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
          --memory 1Gi \
          --cpu 1 \
          --min-instances 0 \
          --max-instances 10 \
          --concurrency 80 \
          --timeout 1200s \
          --cpu-throttling \
          --labels="env=preprod"
        echo "✅ Backend deployed successfully"

  # Smoke Tests
  smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-frontend, deploy-backend]
    if: always() && (needs.deploy-frontend.result == 'success' || needs.deploy-backend.result == 'success')
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCPSECRET }}
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
    
    - name: Wait for services
      run: sleep 15
    
    - name: Test deployed services
      run: |
        # Test Backend if it was deployed
        if [ "${{ needs.deploy-backend.result }}" == "success" ]; then
          BACKEND_URL=$(gcloud run services describe perundhu-backend-preprod --region ${{ env.GCP_REGION }} --format 'value(status.url)')
          echo "🧪 Testing Backend: $BACKEND_URL"
          for i in {1..5}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $BACKEND_URL/actuator/health || echo "000")
            if [ "$HTTP_CODE" -eq "200" ]; then
              echo "✅ Backend is healthy"
              break
            fi
            echo "Retry $i/5..."
            sleep 5
          done
        fi
        
        # Test Frontend if it was deployed
        if [ "${{ needs.deploy-frontend.result }}" == "success" ]; then
          FRONTEND_URL=$(gcloud run services describe perundhu-frontend-preprod --region ${{ env.GCP_REGION }} --format 'value(status.url)')
          echo "🧪 Testing Frontend: $FRONTEND_URL"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $FRONTEND_URL)
          if [ "$HTTP_CODE" -eq "200" ]; then
            echo "✅ Frontend is accessible"
          fi
        fi

  # Deployment Summary
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, build-frontend, build-backend, run-migrations, deploy-frontend, deploy-backend, smoke-tests]
    if: always()
    steps:
    - name: Generate Summary
      run: |
        echo "## 🚀 Pre-Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Pipeline Status" >> $GITHUB_STEP_SUMMARY
        echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Frontend | ${{ needs.build-frontend.result || 'skipped' }} → ${{ needs.deploy-frontend.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Backend | ${{ needs.build-backend.result || 'skipped' }} → ${{ needs.deploy-backend.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Migrations | ${{ needs.run-migrations.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Smoke Tests | ${{ needs.smoke-tests.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Key Changes" >> $GITHUB_STEP_SUMMARY
        echo "✨ **Improvements in this pipeline:**" >> $GITHUB_STEP_SUMMARY
        echo "- Removed duplicate builds from CI (builds use artifacts from CI pipeline)" >> $GITHUB_STEP_SUMMARY
        echo "- Simplified Flyway migration process with better error handling" >> $GITHUB_STEP_SUMMARY
        echo "- Only Docker image push in CD, not full rebuild" >> $GITHUB_STEP_SUMMARY
        echo "- Improved logging and proxy management" >> $GITHUB_STEP_SUMMARY
        echo "- Better environment variable management" >> $GITHUB_STEP_SUMMARY
