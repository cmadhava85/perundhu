name: CI Pipeline

on:
  push:
    branches: [ main, master ]  # Removed develop to save minutes
    paths-ignore:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform.yml'
      - '**.md'
  pull_request:
    branches: [ main, master, develop ]
    paths-ignore:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform.yml'
      - '**.md'
  workflow_dispatch:

# Cancel in-progress runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '18'
  JAVA_VERSION: '21'

jobs:
  # Merged lint + test into one job — saves one VM boot and one npm ci (~1-2 min)
  frontend-checks:
    name: Frontend Lint, Type Check & Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run ESLint
      working-directory: ./frontend
      run: npm run lint --if-present || echo "No lint script found"

    - name: TypeScript type check
      working-directory: ./frontend
      run: npx tsc --noEmit

    - name: Run tests
      working-directory: ./frontend
      run: npm test --if-present || echo "No tests configured"
      env:
        CI: true

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-checks]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Build application
      working-directory: ./frontend
      run: npm run build
    
    # Skip artifact upload to save storage quota - images are pushed to GCR during CD
    - name: Verify build output
      working-directory: ./frontend
      run: |
        echo "✅ Frontend build successful"
        ls -la dist/

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Grant execute permission for gradlew
      working-directory: ./backend
      run: chmod +x gradlew
    
    - name: Run tests
      working-directory: ./backend
      run: ./gradlew test
      env:
        SPRING_PROFILES_ACTIVE: test
        SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb
        SPRING_DATASOURCE_USERNAME: sa
        SPRING_DATASOURCE_PASSWORD: ""

    # Build the deployable JAR once here and share it with CD — avoids a
    # full clean rebuild in the CD build-backend job (~3-4 min saved per push)
    - name: Build deployable JAR
      if: success() && github.event_name == 'push'
      working-directory: ./backend
      run: ./gradlew bootJar -x test --no-daemon

    - name: Upload Backend JAR artifact
      if: success() && github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: backend-jar-${{ github.sha }}
        path: backend/build/libs/*.jar
        retention-days: 1
        if-no-files-found: warn

    # Only upload test results on failure to save storage
    - name: Upload test results on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: backend-test-results
        path: backend/build/reports/tests/
        retention-days: 1

  # backend-build job removed — it compiled a JAR that was immediately discarded
  # (the CD pipeline rebuilt from scratch anyway). The JAR is now built once in
  # backend-test (above) and shared to CD via artifact upload.

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    
    steps:
    - uses: actions/checkout@v4
    
    # Single Trivy scan producing SARIF output — previously ran twice
    # (table format + SARIF format), wasting ~1-2 min per run
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@0.33.1
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        exit-code: '0'
        severity: 'CRITICAL,HIGH'
    
    - name: Upload Trivy results to GitHub Security
      if: always() && hashFiles('trivy-results.sarif') != ''
      uses: github/codeql-action/upload-sarif@v4
      continue-on-error: true
      with:
        sarif_file: 'trivy-results.sarif'
