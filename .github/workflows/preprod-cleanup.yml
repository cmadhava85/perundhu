name: PreProd - Cleanup Services

on:
  workflow_dispatch:
    inputs:
      delete_backend:
        description: 'Delete Backend'
        type: boolean
        default: true
      delete_frontend:
        description: 'Delete Frontend'
        type: boolean
        default: true
      stop_cloud_sql:
        description: 'Stop Cloud SQL (keeps data, stops charges)'
        type: boolean
        default: true
  # schedule:
  #   # Optional: Auto-cleanup every night at 11 PM EST (4:00 AM UTC)
  #   # Uncomment if you want automatic cleanup
  #   - cron: '0 4 * * *'

env:
  PROJECT_ID: astute-strategy-406601
  REGION: us-central1
  BACKEND_SERVICE: perundhu-backend-preprod
  FRONTEND_SERVICE: perundhu-frontend-preprod
  SQL_INSTANCE: perundhu-preprod-mysql-us

jobs:
  cleanup-services:
    name: Delete Cloud Run Services
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCPSECRET_PREPROD }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Check current services
        run: |
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "## 🔍 Current Services" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # List Cloud Run services
          echo "### Cloud Run Services" >> $GITHUB_STEP_SUMMARY
          gcloud run services list \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --format="table(name,status.url)" >> $GITHUB_STEP_SUMMARY || echo "No services found" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Delete Backend Service
        if: github.event.inputs.delete_backend == 'true' || github.event_name == 'schedule'
        run: |
          echo "🗑️ Deleting backend service..."
          
          if gcloud run services describe ${{ env.BACKEND_SERVICE }} \
             --project=${{ env.PROJECT_ID }} \
             --region=${{ env.REGION }} > /dev/null 2>&1; then
            
            gcloud run services delete ${{ env.BACKEND_SERVICE }} \
              --project=${{ env.PROJECT_ID }} \
              --region=${{ env.REGION }} \
              --quiet
            
            echo "✅ Backend deleted: ${{ env.BACKEND_SERVICE }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ Backend service not found (already deleted)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Delete Frontend Service
        if: github.event.inputs.delete_frontend == 'true' || github.event_name == 'schedule'
        run: |
          echo "🗑️ Deleting frontend service..."
          
          if gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
             --project=${{ env.PROJECT_ID }} \
             --region=${{ env.REGION }} > /dev/null 2>&1; then
            
            gcloud run services delete ${{ env.FRONTEND_SERVICE }} \
              --project=${{ env.PROJECT_ID }} \
              --region=${{ env.REGION }} \
              --quiet
            
            echo "✅ Frontend deleted: ${{ env.FRONTEND_SERVICE }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ Frontend service not found (already deleted)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Stop Cloud SQL
        if: github.event.inputs.stop_cloud_sql == 'true' || github.event_name == 'schedule'
        run: |
          echo "🛑 Stopping Cloud SQL instance..."
          
          STATUS=$(gcloud sql instances describe ${{ env.SQL_INSTANCE }} \
            --project=${{ env.PROJECT_ID }} \
            --format="value(state)" 2>/dev/null || echo "NOT_FOUND")
          
          if [[ "$STATUS" == "RUNNABLE" ]]; then
            gcloud sql instances patch ${{ env.SQL_INSTANCE }} \
              --project=${{ env.PROJECT_ID }} \
              --activation-policy=NEVER \
              --quiet
            
            echo "✅ Cloud SQL stopped: ${{ env.SQL_INSTANCE }}" >> $GITHUB_STEP_SUMMARY
            echo "   (Data preserved, charges stopped)" >> $GITHUB_STEP_SUMMARY
          elif [[ "$STATUS" == "STOPPED" ]]; then
            echo "ℹ️ Cloud SQL already stopped" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Cloud SQL status: $STATUS" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Verify Cleanup
        run: |
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Cleanup Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check remaining services
          SERVICES=$(gcloud run services list \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --format="value(name)" | wc -l)
          
          SQL_STATUS=$(gcloud sql instances describe ${{ env.SQL_INSTANCE }} \
            --project=${{ env.PROJECT_ID }} \
            --format="value(state)" 2>/dev/null || echo "STOPPED")
          
          echo "### Final Status" >> $GITHUB_STEP_SUMMARY
          echo "- Cloud Run services: $SERVICES running" >> $GITHUB_STEP_SUMMARY
          echo "- Cloud SQL status: $SQL_STATUS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "$SERVICES" -eq 0 ]] && [[ "$SQL_STATUS" != "RUNNABLE" ]]; then
            echo "💰 **All services cleaned up - no ongoing charges**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Some services still running - charges may apply" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "To redeploy when needed:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "gh workflow run preprod-on-demand.yml" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
