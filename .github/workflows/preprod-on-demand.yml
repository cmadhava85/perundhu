name: PreProd - On-Demand Deploy & Auto-Cleanup

on:
  workflow_dispatch:
    inputs:
      auto_cleanup_hours:
        description: 'Auto-delete services after X hours (0 = no auto-cleanup)'
        required: true
        default: '2'
        type: choice
        options:
          - '0'
          - '1'
          - '2'
          - '4'
          - '8'
      deploy_backend:
        description: 'Deploy Backend'
        type: boolean
        default: true
      deploy_frontend:
        description: 'Deploy Frontend'
        type: boolean
        default: true
  pull_request:
    branches: [main, master, develop]
    types: [labeled]
    # Only deploy when PR is labeled with 'deploy-preprod'

concurrency:
  group: preprod-deploy-${{ github.ref }}
  cancel-in-progress: true  # Cancel old deploys to save cost

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_ID: astute-strategy-406601  # Preprod GCP project
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: perundhu-preprod-us
  BACKEND_SERVICE: perundhu-backend-preprod
  FRONTEND_SERVICE: perundhu-frontend-preprod
  SQL_INSTANCE: perundhu-preprod-mysql-us
  SQL_CONNECTION_NAME: astute-strategy-406601:us-central1:perundhu-preprod-mysql-us

jobs:
  # Only deploy if manually triggered OR if PR has 'deploy-preprod' label
  check-deployment:
    name: Check if deployment needed
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.result }}
      cleanup_hours: ${{ steps.check.outputs.cleanup_hours }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual trigger - deploying"
            echo "result=true" >> $GITHUB_OUTPUT
            echo "cleanup_hours=${{ github.event.inputs.auto_cleanup_hours }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "pull_request" ]] && \
               [[ "${{ contains(github.event.pull_request.labels.*.name, 'deploy-preprod') }}" == "true" ]]; then
            echo "PR labeled with 'deploy-preprod' - deploying"
            echo "result=true" >> $GITHUB_OUTPUT
            echo "cleanup_hours=2" >> $GITHUB_OUTPUT  # Auto-cleanup after 2 hours for PR deploys
          else
            echo "Skipping deployment"
            echo "result=false" >> $GITHUB_OUTPUT
          fi

  # Start Cloud SQL (if stopped) to prevent the retry-loop issue we just fixed
  start-cloud-sql:
    name: Start Cloud SQL
    needs: check-deployment
    if: needs.check-deployment.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCPSECRET_PREPROD }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Check and Start Cloud SQL
        run: |
          echo "🔍 Checking Cloud SQL status..."
          
          STATUS=$(gcloud sql instances describe ${{ env.SQL_INSTANCE }} \
            --project=${{ env.PROJECT_ID }} \
            --format="value(state)" 2>/dev/null || echo "STOPPED")
          
          if [[ "$STATUS" == "STOPPED" ]] || [[ "$STATUS" == "RUNNABLE" ]]; then
            # Use || true: gcloud exits non-zero when the operation takes longer than
            # its own client timeout (~10 min), even though the instance eventually
            # becomes RUNNABLE. The polling loop below handles the actual readiness check.
            gcloud sql instances patch ${{ env.SQL_INSTANCE }} \
              --project=${{ env.PROJECT_ID }} \
              --activation-policy=ALWAYS \
              --quiet || true
            
            echo "⏱️ Waiting for instance to be ready (max 5 minutes)..."
            for i in {1..60}; do
              STATUS=$(gcloud sql instances describe ${{ env.SQL_INSTANCE }} \
                --project=${{ env.PROJECT_ID }} \
                --format="value(state)")
              
              if [[ "$STATUS" == "RUNNABLE" ]]; then
                echo "✅ Cloud SQL is ready"
                break
              fi
              
              if [[ $i -eq 60 ]]; then
                echo "❌ Cloud SQL did not reach RUNNABLE after 5 minutes (last status: $STATUS)"
                exit 1
              fi
              
              echo "Current status: $STATUS (attempt $i/60)"
              sleep 5
            done
          else
            echo "✅ Cloud SQL already running (status: $STATUS)"
          fi
          
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "## Cloud SQL Status" >> $GITHUB_STEP_SUMMARY
          echo "- Instance: ${{ env.SQL_INSTANCE }}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: $STATUS" >> $GITHUB_STEP_SUMMARY

  build-and-deploy-backend:
    name: Deploy Backend
    needs: [check-deployment, start-cloud-sql]
    if: needs.check-deployment.outputs.should_deploy == 'true' && (github.event.inputs.deploy_backend == 'true' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Backend JAR
        working-directory: ./backend
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar -x test --no-daemon

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCPSECRET_PREPROD }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build & Push Backend Image
        run: |
          TAG="$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${TAG}"
          
          docker build --platform=linux/amd64 -t $IMAGE ./backend
          docker push $IMAGE
          
          echo "BACKEND_IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --image=${{ env.BACKEND_IMAGE }} \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --min-instances=0 \
            --max-instances=2 \
            --cpu=1 \
            --memory=512Mi \
            --timeout=300 \
            --concurrency=200 \
            --cpu-throttling \
            --execution-environment=gen2 \
            --add-cloudsql-instances=${{ env.SQL_CONNECTION_NAME }} \
            --set-env-vars="SPRING_PROFILES_ACTIVE=preprod" \
            --allow-unauthenticated \
            --quiet
          
          echo "✅ Backend deployed successfully" >> $GITHUB_STEP_SUMMARY

      - name: Verify Backend Health
        run: |
          URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --format="value(status.url)")
          
          echo "🔍 Checking backend health at: $URL/actuator/health"
          
          # Wait up to 2 minutes for service to be ready
          for i in {1..24}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/actuator/health" || echo "000")
            
            if [[ "$HTTP_CODE" == "200" ]]; then
              echo "✅ Backend is healthy!"
              echo "Backend URL: $URL" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
            
            echo "Health check returned $HTTP_CODE (attempt $i/24)"
            sleep 5
          done
          
          echo "❌ Backend health check failed after 2 minutes"
          echo "⚠️ Backend may not be healthy - check logs" >> $GITHUB_STEP_SUMMARY
          exit 1

  build-and-deploy-frontend:
    name: Deploy Frontend
    needs: [check-deployment, build-and-deploy-backend]
    if: |
      always() && 
      needs.check-deployment.outputs.should_deploy == 'true' && 
      (github.event.inputs.deploy_frontend == 'true' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCPSECRET_PREPROD }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Get Backend URL
        id: backend
        run: |
          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --format="value(status.url)" 2>/dev/null || echo "https://perundhu-backend-preprod.run.app")
          
          echo "backend_url=$BACKEND_URL" >> $GITHUB_OUTPUT

      - name: Build & Push Frontend Image
        env:
          BACKEND_URL: ${{ steps.backend.outputs.backend_url }}
        run: |
          TAG="$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${TAG}"
          
          # Create .env file for build
          cat > ./frontend/.env.production.local << EOF
          VITE_API_URL=$BACKEND_URL
          VITE_API_BASE_URL=$BACKEND_URL
          VITE_GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
          EOF
          
          docker build --platform=linux/amd64 -t $IMAGE ./frontend
          docker push $IMAGE
          
          echo "FRONTEND_IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.FRONTEND_SERVICE }} \
            --image=${{ env.FRONTEND_IMAGE }} \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --min-instances=0 \
            --max-instances=2 \
            --cpu=1 \512
            --memory=256Mi \
            --timeout=60 \
            --concurrency=200 \
            --cpu-throttling \
            --execution-environment=gen2 \
            --allow-unauthenticated \
            --quiet
          
          URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --format="value(status.url)")
          
          echo "✅ Frontend deployed: $URL" >> $GITHUB_STEP_SUMMARY

  # Schedule automatic cleanup to prevent runaway costs
  schedule-cleanup:
    name: Schedule Auto-Cleanup
    needs: [check-deployment, build-and-deploy-backend, build-and-deploy-frontend]
    if: |
      always() && 
      needs.check-deployment.outputs.should_deploy == 'true' && 
      needs.check-deployment.outputs.cleanup_hours != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Schedule cleanup workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HOURS=${{ needs.check-deployment.outputs.cleanup_hours }}
          
          echo "⏰ Cleanup scheduled in $HOURS hours" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To manually cleanup before then, run:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "gh workflow run preprod-cleanup.yml" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          
          # Note: To actually schedule cleanup, you'd need a separate scheduled workflow
          # or use a service like GitHub Actions scheduled dispatches (requires API call)
          echo "💡 Manual cleanup required after testing to avoid costs"
          echo "   Run: gh workflow run preprod-cleanup.yml"

  deployment-summary:
    name: Deployment Summary
    needs: [check-deployment, build-and-deploy-backend, build-and-deploy-frontend]
    if: always() && needs.check-deployment.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCPSECRET_PREPROD }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Generate Summary
        run: |
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "## 🚀 PreProd Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Get service URLs
          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --format="value(status.url)" 2>/dev/null || echo "Not deployed")
          
          FRONTEND_URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --format="value(status.url)" 2>/dev/null || echo "Not deployed")
          
          echo "### 🌐 Service URLs" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: [$FRONTEND_URL]($FRONTEND_URL)" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend**: [$BACKEND_URL]($BACKEND_URL)" >> $GITHUB_STEP_SUMMARY
          echo "- **Health**: [$BACKEND_URL/actuator/health]($BACKEND_URL/actuator/health)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 💰 Cost Awareness" >> $GITHUB_STEP_SUMMARY
          echo "- Services are running with \`minInstances=0\` (scale-to-zero)" >> $GITHUB_STEP_SUMMARY
          echo "- Auto-cleanup scheduled in ${{ needs.check-deployment.outputs.cleanup_hours }} hours" >> $GITHUB_STEP_SUMMARY
          echo "- Estimated cost while running: ~$0.50-1.00/day" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 🧹 Manual Cleanup" >> $GITHUB_STEP_SUMMARY
          echo "When done testing, delete services to avoid costs:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "gh workflow run preprod-cleanup.yml" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
