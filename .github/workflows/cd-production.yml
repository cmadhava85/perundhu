name: CD - Deploy to Production

# Production deployments are triggered ONLY by:
# 1. Published releases (GitHub Releases)
# 2. Manual workflow dispatch with version tag
# NOT triggered by regular commits to main/master
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to deploy (e.g., v1.2.3)'
        required: true
        type: string
      deploy_frontend:
        description: 'Deploy Frontend'
        type: boolean
        default: true
      deploy_backend:
        description: 'Deploy Backend'
        type: boolean
        default: true

# Prevent concurrent production deployments
concurrency:
  group: production-deploy
  cancel-in-progress: false  # Don't cancel production deploys

env:
  GCP_PROJECT_ID: perundhu-prod-001
  GCP_REGION: us-central1
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev
  NODE_VERSION: '20'
  JAVA_VERSION: '21'

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.version || github.event.release.tag_name }}
    
    - name: Validate version tag
      run: |
        VERSION=${{ github.event.inputs.version || github.event.release.tag_name }}
        if [[ ! $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid version format: $VERSION (expected: vX.Y.Z)"
          exit 1
        fi

  build-and-push-images:
    name: Build & Push Production Images
    runs-on: ubuntu-latest
    needs: [validate-release]
    permissions:
      contents: read
      id-token: write
    
    outputs:
      frontend_image: ${{ steps.set-outputs.outputs.frontend_image }}
      backend_image: ${{ steps.set-outputs.outputs.backend_image }}
      version: ${{ steps.set-outputs.outputs.version }}
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.version || github.event.release.tag_name }}
    
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Build Backend JAR
      working-directory: ./backend
      run: |
        chmod +x gradlew
        ./gradlew build -x test
    
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCPSECRET }}
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
    
    - name: Configure Docker for Artifact Registry
      run: |
        gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }}
    
    - name: Build and push images
      id: set-outputs
      run: |
        VERSION=${{ github.event.inputs.version || github.event.release.tag_name }}
        
        # Get Google Maps API key from Secret Manager
        GOOGLE_MAPS_API_KEY=$(gcloud secrets versions access latest --secret=google-maps-api-key 2>/dev/null || echo "")
        
        # Frontend - Build with production environment variables
        FRONTEND_IMAGE="${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/perundhu/frontend:${VERSION}"
        FRONTEND_LATEST="${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/perundhu/frontend:latest"
        
        # Create .env.production.local to add runtime values (DO NOT override VITE_API_URL!)
        # .env.production already has VITE_API_URL=/api for reverse proxy routing
        echo "VITE_APP_VERSION=${VERSION}" > ./frontend/.env.production.local
        echo "VITE_GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}" >> ./frontend/.env.production.local
        
        echo "Created .env.production.local with VERSION=$VERSION"
        cat ./frontend/.env.production.local
        
        # Clear Docker BuildKit cache to avoid corrupted layer issues
        docker builder prune -f --filter "until=24h" || true
        
        # Build with --no-cache to avoid cache corruption issues
        docker build --no-cache -t $FRONTEND_IMAGE -t $FRONTEND_LATEST ./frontend
        docker push $FRONTEND_IMAGE
        docker push $FRONTEND_LATEST
        
        # Backend
        BACKEND_IMAGE="${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/perundhu/backend:${VERSION}"
        BACKEND_LATEST="${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/perundhu/backend:latest"
        docker build --no-cache -t $BACKEND_IMAGE -t $BACKEND_LATEST ./backend
        docker push $BACKEND_IMAGE
        docker push $BACKEND_LATEST
        
        echo "frontend_image=$FRONTEND_IMAGE" >> $GITHUB_OUTPUT
        echo "backend_image=$BACKEND_IMAGE" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT

  run-flyway-migrations:
    name: Run Flyway DB Migrations
    runs-on: ubuntu-latest
    needs: [build-and-push-images]
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.version || github.event.release.tag_name }}

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCPSECRET }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Get DB credentials from Secret Manager
      run: |
        DB_USERNAME=$(gcloud secrets versions access latest --secret=db-username --project=${{ env.GCP_PROJECT_ID }})
        DB_PASSWORD=$(gcloud secrets versions access latest --secret=db-password --project=${{ env.GCP_PROJECT_ID }})
        echo "::add-mask::$DB_USERNAME"
        echo "::add-mask::$DB_PASSWORD"
        echo "DB_USERNAME=$DB_USERNAME" >> $GITHUB_ENV
        echo "DB_PASSWORD=$DB_PASSWORD" >> $GITHUB_ENV

    - name: Install Cloud SQL Auth Proxy
      run: |
        curl -fsSL -o cloud-sql-proxy \
          https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
        chmod +x cloud-sql-proxy

    - name: Start Cloud SQL Auth Proxy
      run: |
        ./cloud-sql-proxy --port=3307 \
          ${{ env.GCP_PROJECT_ID }}:${{ env.GCP_REGION }}:perundhu-production-mysql-us &
        echo "PROXY_PID=$!" >> $GITHUB_ENV
        sleep 5

    - name: Run Flyway Migrations
      run: |
        docker run --rm \
          --network="host" \
          -v "$PWD/backend/app/src/main/resources/db/migration:/flyway/sql" \
          -e FLYWAY_URL="jdbc:mysql://127.0.0.1:3307/perundhu?useSSL=false&allowPublicKeyRetrieval=true" \
          -e FLYWAY_USER="${DB_USERNAME}" \
          -e FLYWAY_PASSWORD="${DB_PASSWORD}" \
          -e FLYWAY_OUT_OF_ORDER=true \
          flyway/flyway:10-alpine \
          repair migrate

    - name: Stop Cloud SQL Auth Proxy
      if: always()
      run: kill "$PROXY_PID" 2>/dev/null || true

  deploy-to-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push-images, run-flyway-migrations]
    environment:
      name: production
      url: https://perundhu.com
    permissions:
      contents: read
      id-token: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCPSECRET }}
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
    
    - name: Get Backend URL
      id: backend-url
      run: |
        BACKEND_URL=$(gcloud run services describe perundhu-production-backend --region ${{ env.GCP_REGION }} --format 'value(status.url)' 2>/dev/null || echo "")
        echo "backend_url=$BACKEND_URL" >> $GITHUB_OUTPUT
    
    - name: Deploy Backend to Production
      run: |
        # Environment variables and secrets are configured to match actual production deployment
        # DB credentials, JWT secret, and encryption key are read from Secret Manager
        # Flyway migrations are enabled in production
        VERSION_LABEL=$(echo "${{ needs.build-and-push-images.outputs.version }}" | tr '.' '-' | tr -d 'v')
        gcloud run deploy perundhu-production-backend \
          --image ${{ needs.build-and-push-images.outputs.backend_image }} \
          --platform managed \
          --region ${{ env.GCP_REGION }} \
          --allow-unauthenticated \
          --service-account=cloud-run-sa@perundhu-prod-001.iam.gserviceaccount.com \
          --add-cloudsql-instances=${{ env.GCP_PROJECT_ID }}:${{ env.GCP_REGION }}:perundhu-production-mysql-us \
          --set-env-vars="SPRING_PROFILES_ACTIVE=production,FLYWAY_ENABLED=true,SPRING_FLYWAY_ENABLED=true" \
          --set-secrets="DB_URL=production-db-url:latest,DB_USERNAME=db-username:latest,DB_PASSWORD=db-password:latest,JWT_SECRET=production-jwt-secret:latest,SECURITY_DATA_ENCRYPTION_KEY=production-data-encryption-key:latest,ADMIN_USERNAME=admin-username:latest,ADMIN_PASSWORD=admin-password:latest,GEMINI_API_KEY=gemini-api-key:latest,RECAPTCHA_SITE_KEY=recaptcha-site-key:latest,RECAPTCHA_SECRET_KEY=recaptcha-secret-key:latest" \
          --memory 512Mi \
          --cpu 1 \
          --min-instances 0 \
          --max-instances 5 \
          --concurrency 80 \
          --timeout 60s \
          --cpu-throttling \
          --execution-environment gen2 \
          --labels="version=${VERSION_LABEL},env=production"
        # Ensure 100% traffic goes to the latest revision (overrides any pinned traffic)
        gcloud run services update-traffic perundhu-production-backend \
          --platform managed \
          --region ${{ env.GCP_REGION }} \
          --to-latest
    
    - name: Deploy Frontend to Production
      run: |
        VERSION_LABEL=$(echo "${{ needs.build-and-push-images.outputs.version }}" | tr '.' '-' | tr -d 'v')
        # VITE_API_URL is baked at build time from frontend/.env.production as "/api"
        # nginx inside the container proxies /api/* to the backend Cloud Run service
        # Do NOT set VITE_API_URL here - it would have no effect on already-built static assets
        gcloud run deploy perundhu-production-frontend \
          --image ${{ needs.build-and-push-images.outputs.frontend_image }} \
          --platform managed \
          --region ${{ env.GCP_REGION }} \
          --allow-unauthenticated \
          --port 8080 \
          --memory 256Mi \
          --cpu 1 \
          --min-instances 0 \
          --max-instances 2 \
          --concurrency 200 \
          --timeout 60s \
          --cpu-throttling \
          --execution-environment gen2 \
          --labels="version=${VERSION_LABEL},env=production"
    
    - name: Get service URLs
      id: urls
      run: |
        BACKEND_URL=$(gcloud run services describe perundhu-production-backend --region ${{ env.GCP_REGION }} --format 'value(status.url)')
        FRONTEND_URL=$(gcloud run services describe perundhu-production-frontend --region ${{ env.GCP_REGION }} --format 'value(status.url)')
        echo "backend_url=$BACKEND_URL" >> $GITHUB_OUTPUT
        echo "frontend_url=$FRONTEND_URL" >> $GITHUB_OUTPUT
    
    - name: Create Custom Domain Mappings (if not exists)
      run: |
        # Cloud Run custom domain mappings handle DNS automatically via CNAME
        echo "Setting up custom domain mappings..."
        
        # Map perundhu.com to frontend (skip if already exists)
        gcloud run domain-mappings create \
          --service=perundhu-production-frontend \
          --domain=perundhu.com \
          --region=${{ env.GCP_REGION }} \
          --project=${{ env.GCP_PROJECT_ID }} 2>/dev/null || echo "Frontend domain mapping may already exist"
        
        # Map www.perundhu.com to frontend
        gcloud run domain-mappings create \
          --service=perundhu-production-frontend \
          --domain=www.perundhu.com \
          --region=${{ env.GCP_REGION }} \
          --project=${{ env.GCP_PROJECT_ID }} 2>/dev/null || echo "WWW domain mapping may already exist"
        
        # NOTE: api.perundhu.com is NOT used. API is served via nginx reverse proxy
        # at perundhu.com/api/* -> backend Cloud Run service (configured in nginx.conf)
        
        echo ""
        echo "Domain mappings configured. Update DNS at your registrar:"
        echo "  perundhu.com     -> CNAME ghs.googlehosted.com."
        echo "  www.perundhu.com -> CNAME ghs.googlehosted.com."
        echo "  API served via nginx proxy at perundhu.com/api/ (no separate api subdomain needed)"
        echo ""
        echo "Service URLs:"
        echo "  Frontend: ${{ steps.urls.outputs.frontend_url }}"
        echo "  Backend: ${{ steps.urls.outputs.backend_url }}"

  run-production-tests:
    name: Run Production Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-to-production]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCPSECRET }}
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
    
    - name: Get service URLs
      run: |
        BACKEND_URL=$(gcloud run services describe perundhu-production-backend --region ${{ env.GCP_REGION }} --format 'value(status.url)')
        FRONTEND_URL=$(gcloud run services describe perundhu-production-frontend --region ${{ env.GCP_REGION }} --format 'value(status.url)')
        echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_ENV
        echo "FRONTEND_URL=$FRONTEND_URL" >> $GITHUB_ENV
    
    - name: Test Backend Health
      run: |
        echo "Waiting for backend to be ready..."
        sleep 30
        
        # Use /actuator/health/liveness — checks JVM liveness only, no DB dependency.
        # DB warm-up on startup temporarily starves the pool and makes /actuator/health
        # return 503; liveness is always UP once the app is running.
        for i in {1..10}; do
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.BACKEND_URL }}/actuator/health/liveness || echo "000")
          if [[ "$HTTP_CODE" == "200" ]]; then
            echo "Backend is healthy (HTTP $HTTP_CODE)"
            break
          fi
          if [ $i -eq 10 ]; then
            echo "Backend health check failed after 10 attempts (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Attempt $i failed with HTTP $HTTP_CODE, retrying in 15s..."
          sleep 15
        done
    
    - name: Test Frontend
      run: |
        curl -f ${{ env.FRONTEND_URL }} || exit 1
    
    - name: Test API endpoints
      run: |
        # Test a sample API endpoint
        curl -f ${{ env.BACKEND_URL }}/api/locations || echo "Locations endpoint test"

  create-deployment-summary:
    name: Create Deployment Summary
    runs-on: ubuntu-latest
    needs: [build-and-push-images, deploy-to-production, run-production-tests]
    if: always()
    
    steps:
    - name: Generate summary
      run: |
        echo "## 🚀 Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Deployment Details" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: ${{ needs.build-and-push-images.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Environment**: Production" >> $GITHUB_STEP_SUMMARY
        echo "- **Deployed by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit SHA**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Docker Images" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Frontend**: ${{ needs.build-and-push-images.outputs.frontend_image }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Backend**: ${{ needs.build-and-push-images.outputs.backend_image }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Status" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "${{ needs.run-production-tests.result }}" == "success" ]; then
          echo "✅ All smoke tests passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Some smoke tests failed" >> $GITHUB_STEP_SUMMARY
        fi

  notify-deployment:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-to-production]
    if: always()
    
    steps:
    - name: Send Slack notification
      if: env.SLACK_WEBHOOK_URL != ''
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      run: |
        STATUS="${{ needs.deploy-to-production.result }}"
        COLOR="good"
        if [ "$STATUS" != "success" ]; then
          COLOR="danger"
        fi
        
        curl -X POST $SLACK_WEBHOOK_URL -H 'Content-Type: application/json' -d "{
          \"attachments\": [{
            \"color\": \"$COLOR\",
            \"title\": \"Production Deployment $STATUS\",
            \"fields\": [
              {\"title\": \"Version\", \"value\": \"${{ needs.build-and-push-images.outputs.version }}\", \"short\": true},
              {\"title\": \"Status\", \"value\": \"$STATUS\", \"short\": true},
              {\"title\": \"Deployed by\", \"value\": \"${{ github.actor }}\", \"short\": true}
            ]
          }]
        }"
