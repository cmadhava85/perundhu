name: CD - Preprod Deployment

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy Backend'
        type: boolean
        default: true
      deploy_frontend:
        description: 'Deploy Frontend'
        type: boolean
        default: true

concurrency:
  group: preprod-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: astute-strategy-406601
  REGION: asia-south1
  REGISTRY: asia-south1-docker.pkg.dev
  SQL_INSTANCE: astute-strategy-406601:asia-south1:perundhu-preprod-mysql
  SQL_INSTANCE_NAME: perundhu-preprod-mysql

jobs:
  check-ci:
    name: Check CI Status
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.result }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual trigger - proceeding with deployment"
            echo "result=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]]; then
            echo "CI succeeded - proceeding with deployment"
            echo "result=true" >> $GITHUB_OUTPUT
          else
            echo "CI did not succeed (status: ${{ github.event.workflow_run.conclusion }}) - skipping deployment"
            echo "result=false" >> $GITHUB_OUTPUT
          fi

  build-backend:
    name: Build Backend
    needs: check-ci
    if: needs.check-ci.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Backend JAR
        working-directory: ./backend
        run: |
          chmod +x gradlew
          ./gradlew build -x test

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCPSECRET }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build & Push Backend Image
        run: |
          TAG="$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/perundhu/backend:${TAG}"
          LATEST="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/perundhu/backend:preprod-latest"
          
          # Build for linux/amd64 platform (Cloud Run requirement)
          docker build --platform=linux/amd64 -t $IMAGE -t $LATEST ./backend
          docker push $IMAGE
          docker push $LATEST
          
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

  build-frontend:
    name: Build Frontend
    needs: check-ci
    if: needs.check-ci.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCPSECRET }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build & Push Frontend Image
        run: |
          TAG="$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/perundhu/frontend:${TAG}"
          LATEST="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/perundhu/frontend:preprod-latest"
          
          # Get Google Maps API key
          MAPS_KEY=$(gcloud secrets versions access latest --secret=google-maps-api-key 2>/dev/null || echo "")
          
          # Create env files
          cat > ./frontend/.env.local << EOF
          VITE_API_URL=https://perundhu-backend-preprod-1032721240281.asia-south1.run.app
          VITE_API_BASE_URL=https://perundhu-backend-preprod-1032721240281.asia-south1.run.app
          VITE_GOOGLE_MAPS_API_KEY=${MAPS_KEY}
          EOF
          
          cp ./frontend/.env.local ./frontend/.env.production.local
          
          # Build for linux/amd64 platform (Cloud Run requirement)
          docker build --platform=linux/amd64 -t $IMAGE -t $LATEST ./frontend
          docker push $IMAGE
          docker push $LATEST

  run-migrations:
    name: Run Migrations
    needs: [check-ci, build-backend]
    if: needs.check-ci.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCPSECRET }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Cloud SQL Proxy
        run: |
          # Download and install Cloud SQL Proxy v2.x (uses port 3306 by default)
          # Using Google's official stable download location
          curl -fL -o cloud_sql_proxy https://dl.google.com/cloudsql/cloud_sql_proxy.v2.linux.amd64 || \
          curl -fL -o cloud_sql_proxy https://dl.google.com/cloudsql/cloud_sql_proxy.linux.amd64
          
          chmod +x cloud_sql_proxy
          sudo mv cloud_sql_proxy /usr/local/bin/
          
          # Verify installation
          /usr/local/bin/cloud_sql_proxy --version

      - name: Run Flyway Migrations
        working-directory: ./backend
        run: |
          # Don't try to kill processes - just let the proxy start fresh
          echo "Waiting 2 seconds for clean state..."
          sleep 2
          
          # Get DB credentials from GCP Secret Manager
          DB_USER=$(gcloud secrets versions access latest --secret=db-username 2>/dev/null || echo "perundhu_user")
          DB_PASSWORD=$(gcloud secrets versions access latest --secret=db-password)
          
          if [ -z "$DB_PASSWORD" ]; then
            echo "❌ Failed to retrieve db-password from Secret Manager"
            exit 1
          fi
          
          echo "✅ Retrieved credentials from Secret Manager"
          echo "   User: $DB_USER"
          echo "   Password length: ${#DB_PASSWORD} characters"
          
          # Flyway configuration - MUST use localhost proxy only
          # Increased timeouts: connectTimeout for proxy initialization, socketTimeout for query execution
          FLYWAY_URL="jdbc:mysql://127.0.0.1:3306/perundhu?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=60000&socketTimeout=120000"
          
          # Start Cloud SQL Proxy with explicit localhost binding on port 3306
          echo "🔌 Starting Cloud SQL Proxy on 127.0.0.1:3306..."
          echo "   Connecting to: ${{ env.SQL_INSTANCE }}"
          /usr/local/bin/cloud_sql_proxy \
            -instances=${{ env.SQL_INSTANCE }}=tcp:127.0.0.1:3306 \
            -max_connections=100 \
            -verbose &
          PROXY_PID=$!
          echo "   Proxy PID: $PROXY_PID"
          
          # Wait for proxy to be ready
          echo "⏳ Waiting for proxy to be ready..."
          for i in {1..60}; do
            if nc -z 127.0.0.1 3306 2>/dev/null; then
              echo "✅ Cloud SQL Proxy ready on port 3306"
              sleep 5  # Extra wait for proxy to fully initialize and establish tunnel to Cloud SQL instance
              break
            fi
            echo "  [$i/60] Waiting for port 3306..."
            sleep 1
          done
          
          # Verify port is actually open
          if ! nc -z 127.0.0.1 3306; then
            echo "❌ Cloud SQL Proxy failed to open port 3306"
            echo "📋 Checking proxy logs..."
            kill $PROXY_PID 2>/dev/null || true
            sleep 2
            echo "🔍 Testing direct connection to database..."
            gcloud sql connect perundhu-preprod-mysql \
              --user=perundhu_user \
              --project=astute-strategy-406601 \
              --database=perundhu \
              --quiet --no-user-output <<< "SELECT 1;" 2>&1 || echo "Direct connection also failed"
            exit 1
          fi
          
          chmod +x gradlew
          
          # Test the connection through the proxy before running migrations
          echo "🧪 Testing proxy connection with mysql client..."
          for i in {1..5}; do
            if mysql -h 127.0.0.1 -u "${DB_USER}" -p"${DB_PASSWORD}" -e "SELECT 1" perundhu &>/dev/null; then
              echo "✅ Proxy connection verified"
              break
            fi
            echo "  [$i/5] Retry..."
            sleep 2
          done
          echo "🔄 Running Flyway migrations through proxy..."
          
          # Export password as environment variable for gradle (more secure and avoids shell escaping issues)
          export FLYWAY_PASSWORD="${DB_PASSWORD}"
          export FLYWAY_USER="${DB_USER}"
          export FLYWAY_URL="${FLYWAY_URL}"
          
          # Debug: Verify variables are set
          echo "📋 Migration Configuration:"
          echo "   URL: $FLYWAY_URL"
          echo "   User: $FLYWAY_USER"
          echo "   Password length: ${#FLYWAY_PASSWORD} chars"
          
          # Try migration directly first (skip repair if successful)
          if ./gradlew flywayMigrate \
            -Pflyway.url="$FLYWAY_URL" \
            -Pflyway.user="$FLYWAY_USER" \
            -Pflyway.password="$FLYWAY_PASSWORD" \
            -Pflyway.driver="com.mysql.cj.jdbc.Driver" \
            -Pflyway.baselineOnMigrate=true \
            -Pflyway.baselineVersion=57 \
            -Pflyway.baselineDescription="Baseline at V57 - multistate locations" \
            -Pflyway.outOfOrder=true \
            -Pflyway.validateOnMigrate=false \
            --no-configuration-cache \
            -x test; then
            echo "✅ Flyway migrations completed successfully"
          else
            MIGRATION_EXIT_CODE=$?
            echo "⚠️  Migration failed on first attempt (exit code: $MIGRATION_EXIT_CODE)"
            echo "    Attempting repair to fix migration history..."
            ./gradlew flywayRepair \
              -Pflyway.url="$FLYWAY_URL" \
              -Pflyway.user="$FLYWAY_USER" \
              -Pflyway.password="$FLYWAY_PASSWORD" \
              -Pflyway.driver="com.mysql.cj.jdbc.Driver" \
              --no-configuration-cache \
              -x test
            
            echo "📝 Running flywayMigrate after repair..."
            ./gradlew flywayMigrate \
              -Pflyway.url="$FLYWAY_URL" \
              -Pflyway.user="$FLYWAY_USER" \
              -Pflyway.password="$FLYWAY_PASSWORD" \
              -Pflyway.driver="com.mysql.cj.jdbc.Driver" \
              -Pflyway.baselineOnMigrate=true \
              -Pflyway.baselineVersion=57 \
              -Pflyway.baselineDescription="Baseline at V57 - multistate locations" \
              -Pflyway.outOfOrder=true \
              -Pflyway.validateOnMigrate=false \
              --no-configuration-cache \
              -x test
            echo "✅ Flyway migrations completed after repair"
          fi
          
          # Cleanup
          kill $PROXY_PID 2>/dev/null || true
          wait $PROXY_PID 2>/dev/null || true

  deploy-backend:
    name: Deploy Backend
    needs: [build-backend, run-migrations]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCPSECRET }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Backend
        run: |
          gcloud run deploy perundhu-backend-preprod \
            --image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/perundhu/backend:preprod-latest \
            --platform=managed \
            --region=${{ env.REGION }} \
            --allow-unauthenticated \
            --set-env-vars="SPRING_PROFILES_ACTIVE=preprod,DB_USERNAME=perundhu_user,SPRING_DATASOURCE_URL=jdbc:mysql://google/perundhu?cloudSqlInstance=${{ env.SQL_INSTANCE }}&socketFactory=com.google.cloud.sql.mysql.SocketFactory&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC,SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver,SPRING_DATASOURCE_USERNAME=perundhu_user,FLYWAY_ENABLED=false,CORS_ALLOWED_ORIGINS=https://perundhu-frontend-preprod-1032721240281.asia-south1.run.app,LOG_LEVEL_ROOT=INFO,LOG_LEVEL_APP=INFO,RATE_LIMIT_ENABLED=true,ORIGIN_VALIDATION_ENABLED=true,HONEYPOT_ENABLED=true,RECAPTCHA_ENABLED=false,GEMINI_API_ENABLED=true,RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY},RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}" \
            --update-secrets="DB_PASSWORD=db-password:latest,SPRING_DATASOURCE_PASSWORD=db-password:latest,GEMINI_API_KEY=gemini-api-key:latest,ADMIN_USERNAME=admin-username:latest,ADMIN_PASSWORD=admin-password:latest,JWT_SECRET=preprod-jwt-secret:latest" \
            --add-cloudsql-instances=${{ env.SQL_INSTANCE }} \
            --memory=2Gi \
            --cpu=2 \
            --min-instances=0 \
            --max-instances=3 \
            --timeout=300s

  deploy-frontend:
    name: Deploy Frontend
    needs: [build-frontend, deploy-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCPSECRET }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Frontend
        run: |
          gcloud run deploy perundhu-frontend-preprod \
            --image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/perundhu/frontend:preprod-latest \
            --platform=managed \
            --region=${{ env.REGION }} \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=5

  verify:
    name: Verify Deployment
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCPSECRET }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Test Services
        run: |
          sleep 20
          
          BACKEND_URL=$(gcloud run services describe perundhu-backend-preprod --region=${{ env.REGION }} --format='value(status.url)')
          FRONTEND_URL=$(gcloud run services describe perundhu-frontend-preprod --region=${{ env.REGION }} --format='value(status.url)')
          
          echo "Backend: $BACKEND_URL"
          echo "Frontend: $FRONTEND_URL"
          
          # Test backend health
          curl -f "${BACKEND_URL}/actuator/health" || echo "Backend health check failed"
          
          # Test frontend
          curl -f "${FRONTEND_URL}" || echo "Frontend check failed"
