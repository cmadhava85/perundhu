name: CD - Preprod Deployment

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy Backend'
        type: boolean
        default: true
      deploy_frontend:
        description: 'Deploy Frontend'
        type: boolean
        default: true

concurrency:
  group: preprod-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_ID: astute-strategy-406601
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: perundhu-preprod-us
  SQL_INSTANCE: astute-strategy-406601:us-central1:perundhu-preprod-mysql-us
  SQL_INSTANCE_NAME: perundhu-preprod-mysql-us

jobs:
  check-ci:
    name: Check CI Status
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      should_deploy: ${{ steps.check.outputs.result }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual trigger - proceeding with deployment"
            echo "result=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]]; then
            echo "CI succeeded - proceeding with deployment"
            echo "result=true" >> $GITHUB_OUTPUT
          else
            echo "CI did not succeed (status: ${{ github.event.workflow_run.conclusion }}) - skipping deployment"
            echo "result=false" >> $GITHUB_OUTPUT
          fi

  build-backend:
    name: Build Backend
    needs: check-ci
    if: needs.check-ci.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read  # needed to download artifacts from the triggering CI run
    steps:
      - uses: actions/checkout@v4

      # Download the JAR built by CI — avoids a full clean rebuild (~3-4 min saved)
      # Falls back to building locally when triggered manually (no CI artifact)
      - name: Download Backend JAR from CI
        id: download-jar
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: backend-jar-${{ github.event.workflow_run.head_sha }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: backend/build/libs/
        continue-on-error: true

      - name: Set up JDK 21
        if: steps.download-jar.outcome != 'success'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Backend JAR
        if: steps.download-jar.outcome != 'success'
        working-directory: ./backend
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar -x test -x spotbugsMain -x spotbugsTest --no-daemon

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCPSECRET_PREPROD }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build & Push Backend Image
        run: |
          TAG="$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${TAG}"
          LATEST="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:preprod-latest"
          
          # Build for linux/amd64 platform (Cloud Run requirement)
          docker build --platform=linux/amd64 -t $IMAGE -t $LATEST ./backend
          docker push $IMAGE
          docker push $LATEST
          
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

  build-frontend:
    name: Build Frontend
    needs: check-ci
    if: needs.check-ci.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCPSECRET_PREPROD }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build & Push Frontend Image
        run: |
          TAG="$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${TAG}"
          LATEST="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:preprod-latest"
          
          # Get Google Maps API key
          MAPS_KEY=$(gcloud secrets versions access latest --secret=google-maps-api-key 2>/dev/null || echo "")
          
          # Create env files
          cat > ./frontend/.env.local << EOF
          VITE_API_URL=https://perundhu-backend-preprod-1032721240281.us-central1.run.app
          VITE_API_BASE_URL=https://perundhu-backend-preprod-1032721240281.us-central1.run.app
          VITE_GOOGLE_MAPS_API_KEY=${MAPS_KEY}
          EOF
          
          cp ./frontend/.env.local ./frontend/.env.production.local
          
          # Build for linux/amd64 platform (Cloud Run requirement)
          docker build --platform=linux/amd64 -t $IMAGE -t $LATEST ./frontend
          docker push $IMAGE
          docker push $LATEST

  run-migrations:
    name: Run Migrations
    needs: [check-ci, build-backend]
    if: false  # Migrations disabled for preprod - run in production first
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCPSECRET_PREPROD }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Cloud SQL Proxy
        run: |
          # Download and install Cloud SQL Proxy v2.x (uses port 3306 by default)
          # Using Google's official stable download location
          curl -fL -o cloud_sql_proxy https://dl.google.com/cloudsql/cloud_sql_proxy.v2.linux.amd64 || \
          curl -fL -o cloud_sql_proxy https://dl.google.com/cloudsql/cloud_sql_proxy.linux.amd64
          
          chmod +x cloud_sql_proxy
          sudo mv cloud_sql_proxy /usr/local/bin/
          
          # Verify installation
          /usr/local/bin/cloud_sql_proxy --version

      - name: Run Flyway Migrations
        working-directory: ./backend
        run: |
          # Don't try to kill processes - just let the proxy start fresh
          echo "Waiting 2 seconds for clean state..."
          sleep 2
          
          # Get DB credentials from GCP Secret Manager
          DB_USER=$(gcloud secrets versions access latest --secret=db-username 2>/dev/null || echo "perundhu_user")
          DB_PASSWORD=$(gcloud secrets versions access latest --secret=db-password)
          
          if [ -z "$DB_PASSWORD" ]; then
            echo "❌ Failed to retrieve db-password from Secret Manager"
            exit 1
          fi
          
          echo "✅ Retrieved credentials from Secret Manager"
          echo "   User: $DB_USER"
          echo "   Password length: ${#DB_PASSWORD} characters"
          
          # Flyway configuration - MUST use localhost proxy only
          # Increased timeouts: connectTimeout for proxy initialization, socketTimeout for query execution
          FLYWAY_URL="jdbc:mysql://127.0.0.1:3306/perundhu?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=60000&socketTimeout=120000"
          
          # Start Cloud SQL Proxy with explicit localhost binding on port 3306
          echo "🔌 Starting Cloud SQL Proxy on 127.0.0.1:3306..."
          echo "   Connecting to: ${{ env.SQL_INSTANCE }}"
          /usr/local/bin/cloud_sql_proxy \
            -instances=${{ env.SQL_INSTANCE }}=tcp:127.0.0.1:3306 \
            -max_connections=100 \
            -verbose &
          PROXY_PID=$!
          echo "   Proxy PID: $PROXY_PID"
          
          # Wait for proxy to be ready
          echo "⏳ Waiting for proxy to be ready..."
          for i in {1..60}; do
            if nc -z 127.0.0.1 3306 2>/dev/null; then
              echo "✅ Cloud SQL Proxy ready on port 3306"
              sleep 5  # Extra wait for proxy to fully initialize and establish tunnel to Cloud SQL instance
              break
            fi
            echo "  [$i/60] Waiting for port 3306..."
            sleep 1
          done
          
          # Verify port is actually open
          if ! nc -z 127.0.0.1 3306; then
            echo "❌ Cloud SQL Proxy failed to open port 3306"
            echo "📋 Checking proxy logs..."
            kill $PROXY_PID 2>/dev/null || true
            sleep 2
            echo "🔍 Testing direct connection to database..."
            gcloud sql connect perundhu-preprod-mysql \
              --user=perundhu_user \
              --project=astute-strategy-406601 \
              --database=perundhu \
              --quiet --no-user-output <<< "SELECT 1;" 2>&1 || echo "Direct connection also failed"
            exit 1
          fi
          
          chmod +x gradlew
          
          # Test the connection through the proxy before running migrations
          echo "🧪 Testing proxy connection with mysql client..."
          for i in {1..5}; do
            if mysql -h 127.0.0.1 -u "${DB_USER}" -p"${DB_PASSWORD}" -e "SELECT 1" perundhu &>/dev/null; then
              echo "✅ Proxy connection verified"
              break
            fi
            echo "  [$i/5] Retry..."
            sleep 2
          done
          echo "🔄 Running Flyway migrations through proxy..."
          
          # Export password as environment variable for gradle (more secure and avoids shell escaping issues)
          export FLYWAY_PASSWORD="${DB_PASSWORD}"
          export FLYWAY_USER="${DB_USER}"
          export FLYWAY_URL="${FLYWAY_URL}"
          
          # Debug: Verify variables are set
          echo "📋 Migration Configuration:"
          echo "   URL: $FLYWAY_URL"
          echo "   User: $FLYWAY_USER"
          echo "   Password length: ${#FLYWAY_PASSWORD} chars"
          
          # Try migration directly first (skip repair if successful)
          if ./gradlew flywayMigrate \
            -Pflyway.url="$FLYWAY_URL" \
            -Pflyway.user="$FLYWAY_USER" \
            -Pflyway.password="$FLYWAY_PASSWORD" \
            -Pflyway.driver="com.mysql.cj.jdbc.Driver" \
            -Pflyway.baselineOnMigrate=false \
            -Pflyway.outOfOrder=true \
            -Pflyway.validateOnMigrate=false \
            -Pflyway.cleanDisabled=true \
            -Pflyway.locations="filesystem:app/src/main/resources/db/migration" \
            -Pflyway.schemas=perundhu \
            -Pflyway.connectRetries=5 \
            -Pflyway.connectRetriesInterval=1 \
            -Pflyway.lockRetryCount=50 \
            -Pflyway.encoding="UTF-8" \
            --no-configuration-cache \
            -x test; then
            echo "✅ Flyway migrations completed successfully"
          else
            MIGRATION_EXIT_CODE=$?
            echo "⚠️  Migration failed on first attempt (exit code: $MIGRATION_EXIT_CODE)"
            echo "    Attempting repair to fix migration history..."
            ./gradlew flywayRepair \
              -Pflyway.url="$FLYWAY_URL" \
              -Pflyway.user="$FLYWAY_USER" \
              -Pflyway.password="$FLYWAY_PASSWORD" \
              -Pflyway.driver="com.mysql.cj.jdbc.Driver" \
              -Pflyway.locations="filesystem:app/src/main/resources/db/migration" \
              -Pflyway.schemas=perundhu \
              -Pflyway.connectRetries=5 \
              -Pflyway.connectRetriesInterval=1 \
              -Pflyway.lockRetryCount=50 \
              -Pflyway.encoding="UTF-8" \
              --no-configuration-cache \
              -x test
            
            echo "📝 Running flywayMigrate after repair..."
            ./gradlew flywayMigrate \
              -Pflyway.url="$FLYWAY_URL" \
              -Pflyway.user="$FLYWAY_USER" \
              -Pflyway.password="$FLYWAY_PASSWORD" \
              -Pflyway.driver="com.mysql.cj.jdbc.Driver" \
              -Pflyway.baselineOnMigrate=false \
              -Pflyway.outOfOrder=true \
              -Pflyway.validateOnMigrate=false \
              -Pflyway.cleanDisabled=true \
              -Pflyway.locations="filesystem:app/src/main/resources/db/migration" \
              -Pflyway.schemas=perundhu \
              -Pflyway.connectRetries=5 \
              -Pflyway.connectRetriesInterval=1 \
              -Pflyway.lockRetryCount=50 \
              -Pflyway.encoding="UTF-8" \
              --no-configuration-cache \
              -x test
            echo "✅ Flyway migrations completed after repair"
          fi
          
          # Cleanup
          kill $PROXY_PID 2>/dev/null || true
          wait $PROXY_PID 2>/dev/null || true

  deploy-backend:
    name: Deploy Backend
    needs: [build-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCPSECRET_PREPROD }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Start Cloud SQL Instance
        run: |
          echo "▶️  Starting Cloud SQL instance for deployment..."
          gcloud sql instances patch ${{ env.SQL_INSTANCE_NAME }} \
            --activation-policy=ALWAYS \
            --project=${{ env.PROJECT_ID }} \
            --quiet || echo "⚠️  Could not start SQL instance"
          echo "⏳ Waiting for Cloud SQL instance to be RUNNABLE..."

      - name: Wait for Cloud SQL Instance to Start
        run: |
          echo "⏳ Waiting for Cloud SQL instance to be RUNNABLE..."
          max_attempts=60
          attempt=0
          
          while [ $attempt -lt $max_attempts ]; do
            status=$(gcloud sql instances describe ${{ env.SQL_INSTANCE_NAME }} \
              --project=${{ env.PROJECT_ID }} \
              --format='value(state)' 2>/dev/null || echo "UNKNOWN")
            
            echo "  [$((attempt+1))/$max_attempts] SQL Instance State: $status"
            
            if [ "$status" = "RUNNABLE" ]; then
              echo "✅ Cloud SQL instance is RUNNABLE"
              break
            fi
            
            if [ "$status" = "FAILED" ] || [ "$status" = "UNKNOWN" ]; then
              echo "❌ Cloud SQL instance failed or unreachable"
              exit 1
            fi
            
            attempt=$((attempt+1))
            sleep 2
          done
          
          if [ $attempt -eq $max_attempts ]; then
            echo "❌ Timeout waiting for Cloud SQL instance to be ready"
            exit 1
          fi
          
          echo "✅ Cloud SQL instance is ready for deployment"
          sleep 5  # Extra buffer to ensure instance is fully initialized

      - name: Deploy Backend
        run: |
          gcloud run deploy perundhu-backend-preprod \
            --image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:preprod-latest \
            --platform=managed \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --allow-unauthenticated \
            --set-env-vars="SPRING_PROFILES_ACTIVE=preprod,FLYWAY_ENABLED=true,SPRING_FLYWAY_ENABLED=true" \
            --update-secrets="DB_USERNAME=db-username:latest,DB_PASSWORD=db-password:latest,ADMIN_USERNAME=admin-username:latest,ADMIN_PASSWORD=admin-password:latest,GEMINI_API_KEY=gemini-api-key:latest,PUBLIC_API_KEY=PUBLIC_API_KEY:latest" \
            --add-cloudsql-instances=${{ env.SQL_INSTANCE }} \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=2 \
            --concurrency=80 \
            --timeout=60s \
            --cpu-throttling \
            --execution-environment=gen2 \
            --cpu-boost \
            --startup-probe="periodSeconds=10,failureThreshold=30,httpGet.path=/actuator/health,httpGet.port=8080"

      - name: Route Traffic to Latest
        run: |
          gcloud run services update-traffic perundhu-backend-preprod \
            --to-latest \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }}

  deploy-frontend:
    name: Deploy Frontend
    # Runs in parallel with deploy-backend — frontend image is self-contained
    # and does not depend on the backend being deployed first (~3-4 min saved)
    needs: [build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCPSECRET_PREPROD }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Frontend
        run: |
          gcloud run deploy perundhu-frontend-preprod \
            --image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:preprod-latest \
            --platform=managed \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=2 \
            --concurrency=80 \
            --timeout=60s \
            --cpu-throttling \
            --execution-environment=gen2

  verify:
    name: Verify Deployment
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCPSECRET_PREPROD }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Test Services
        run: |
          sleep 20
          
          BACKEND_URL=$(gcloud run services describe perundhu-backend-preprod --region=${{ env.REGION }} --format='value(status.url)')
          FRONTEND_URL=$(gcloud run services describe perundhu-frontend-preprod --region=${{ env.REGION }} --format='value(status.url)')
          
          echo "Backend: $BACKEND_URL"
          echo "Frontend: $FRONTEND_URL"
          
          # Test backend health
          curl -f "${BACKEND_URL}/actuator/health" || echo "Backend health check failed"
          
          # Test frontend
          curl -f "${FRONTEND_URL}" || echo "Frontend check failed"

      - name: Cleanup Old Artifact Registry Images
        run: |
          # Keep only images from the last 3 days to reduce storage costs (~$12/month)
          CUTOFF=$(date -u -d '3 days ago' '+%Y-%m-%dT%H:%M:%SZ')
          echo "🗑️  Deleting Artifact Registry images older than 3 days (before ${CUTOFF})..."
          for IMG in backend frontend; do
            echo "  Processing ${IMG}..."
            gcloud artifacts docker images list \
              "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${IMG}" \
              --include-tags \
              --filter="createTime<'${CUTOFF}'" \
              --format="value(version)" \
              --project=${{ env.PROJECT_ID }} 2>/dev/null | \
            while IFS= read -r digest; do
              [[ -n "$digest" ]] && \
                gcloud artifacts docker images delete \
                  "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${IMG}@${digest}" \
                  --delete-tags --quiet 2>/dev/null && \
                echo "    Deleted: ${IMG}@${digest}" || true
            done
          done
          echo "✅ Artifact Registry cleanup complete"

      - name: Delete Orphaned VPC Connector
        run: |
          # VPC Access Connectors run 2x e2-micro VMs billed under Compute Engine (~$14/month)
          # The connector was disabled in Terraform but may still exist as orphaned resource
          echo "🔍 Checking for orphaned VPC Access Connectors..."
          for REGION_CHECK in us-central1; do
            if gcloud compute networks vpc-access connectors describe perundhu-preprod-vpc-conn \
              --region=${REGION_CHECK} --project=${{ env.PROJECT_ID }} --quiet 2>/dev/null; then
              echo "Found connector in ${REGION_CHECK} — deleting..."
              gcloud compute networks vpc-access connectors delete perundhu-preprod-vpc-conn \
                --region=${REGION_CHECK} --project=${{ env.PROJECT_ID }} --quiet && \
                echo "✅ Deleted VPC connector in ${REGION_CHECK} (saves ~$14/month)" || \
                echo "⚠️  Could not delete connector in ${REGION_CHECK}"
            else
              echo "No connector found in ${REGION_CHECK}"
            fi
          done

      # Stop Cloud SQL removed: preprod DB must stay ALWAYS so Cloud Run can connect.
      # db-f1-micro cost is ~$7/month — acceptable within budget.
# Trigger CD pipeline to run migrations
