name: GCP Cost Optimization - Stop/Start Services

on:
  # Automatic schedule disabled - run manually via workflow_dispatch
  # schedule:
  #   # Stop services at 10 PM EST (3:00 AM UTC next day)
  #   - cron: '0 3 * * *'
  #   # Start services at 8 AM EST (1:00 PM UTC)
  #   - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'status'
        type: choice
        options:
          - stop
          - start
          - status

env:
  GCP_PROJECT_ID: astute-strategy-406601
  REGION: asia-south1
  BACKEND_SERVICE: perundhu-backend-preprod
  FRONTEND_SERVICE: perundhu-frontend-preprod
  CLOUD_SQL_INSTANCES: "perundhu-preprod-mysql perundhu-preprod-mysql-asia"

jobs:
  manage-services:
    name: Manage GCP Services
    runs-on: ubuntu-latest
    concurrency:
      group: gcp-cost-optimization
      cancel-in-progress: false
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preflight checks
        run: |
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "## Preflight Checks" >> $GITHUB_STEP_SUMMARY
          MISSING=0
          if [ -z "${{ secrets.GCPSECRET }}" ]; then
            echo "❌ Missing required secret: GCPSECRET" >> $GITHUB_STEP_SUMMARY
            MISSING=1
          fi
          if [ "$MISSING" -eq 1 ]; then
            echo "Required secrets missing. Failing early."
            exit 1
          fi
          echo "✅ Required secrets present" >> $GITHUB_STEP_SUMMARY

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCPSECRET }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      
      - name: Determine action based on schedule
        id: action
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "action=${{ github.event.inputs.action }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          case "${{ github.event.schedule }}" in
            "0 3 * * *")
              echo "action=stop" >> $GITHUB_OUTPUT
              echo "Scheduled stop (10:00 PM EST)" >> $GITHUB_STEP_SUMMARY
              ;;
            "0 13 * * *")
              echo "action=start" >> $GITHUB_OUTPUT
              echo "Scheduled start (8:00 AM EST)" >> $GITHUB_STEP_SUMMARY
              ;;
            *)
              echo "action=status" >> $GITHUB_OUTPUT
              ;;
          esac
      
      - name: Stop Cloud Run services
        if: steps.action.outputs.action == 'stop'
        run: |
          echo "🛑 Stopping Cloud Run services..."
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "## Service Stop Report" >> $GITHUB_STEP_SUMMARY
          
          # Stop backend service
          echo "Stopping ${{ env.BACKEND_SERVICE }}..."
          gcloud run services update ${{ env.BACKEND_SERVICE }} \
            --region=${{ env.REGION }} \
            --no-traffic \
            --quiet 2>&1
          echo "✅ Backend service traffic stopped" >> $GITHUB_STEP_SUMMARY
          
          # Stop frontend service
          echo "Stopping ${{ env.FRONTEND_SERVICE }}..."
          gcloud run services update ${{ env.FRONTEND_SERVICE }} \
            --region=${{ env.REGION }} \
            --no-traffic \
            --quiet 2>&1
          echo "✅ Frontend service traffic stopped" >> $GITHUB_STEP_SUMMARY
          
          # Stop Cloud SQL instances - check current state first
          for INSTANCE in ${{ env.CLOUD_SQL_INSTANCES }}; do
            echo "Checking ${INSTANCE} status..."
            SQL_STATE=$(gcloud sql instances describe "${INSTANCE}" --format="value(state)")
            if [ "${SQL_STATE}" = "RUNNABLE" ]; then
              echo "Stopping ${INSTANCE}..."
              gcloud sql instances patch "${INSTANCE}" \
                --activation-policy=NEVER \
                --quiet 2>&1
              echo "✅ Cloud SQL instance ${INSTANCE} stopped" >> $GITHUB_STEP_SUMMARY
            else
              echo "Cloud SQL instance ${INSTANCE} already stopped (state: ${SQL_STATE})"
              echo "ℹ️ Cloud SQL instance ${INSTANCE} already stopped" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Stopped at:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
      
      - name: Start Cloud Run services
        if: steps.action.outputs.action == 'start'
        run: |
          echo "▶️ Starting Cloud Run services..."
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "## Service Start Report" >> $GITHUB_STEP_SUMMARY
          
          # Start Cloud SQL instances first (takes time)
          for INSTANCE in ${{ env.CLOUD_SQL_INSTANCES }}; do
            echo "Starting ${INSTANCE}..."
            gcloud sql instances patch "${INSTANCE}" \
              --activation-policy=ALWAYS \
              --quiet 2>&1
            echo "✅ Cloud SQL instance ${INSTANCE} start initiated" >> $GITHUB_STEP_SUMMARY
            
            echo "Waiting for ${INSTANCE} to be ready..."
            for i in {1..30}; do
              STATUS=$(gcloud sql instances describe "${INSTANCE}" --format="value(state)")
              if [ "${STATUS}" = "RUNNABLE" ]; then
                echo "✅ Cloud SQL ${INSTANCE} is ready"
                break
              fi
              echo "Waiting... (${i}/30) Status: ${STATUS}"
              sleep 10
            done
          done
          
          # Start backend service
          echo "Starting ${{ env.BACKEND_SERVICE }}..."
          gcloud run services update ${{ env.BACKEND_SERVICE }} \
            --region=${{ env.REGION }} \
            --traffic=100 \
            --quiet 2>&1
          echo "✅ Backend service traffic enabled" >> $GITHUB_STEP_SUMMARY
          
          # Start frontend service
          echo "Starting ${{ env.FRONTEND_SERVICE }}..."
          gcloud run services update ${{ env.FRONTEND_SERVICE }} \
            --region=${{ env.REGION }} \
            --traffic=100 \
            --quiet 2>&1
          echo "✅ Frontend service traffic enabled" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Started at:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
      
      - name: Get services status
        id: status
        if: always()
        run: |
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "## Current Services Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Cloud Run Services" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "**Backend Service:**" >> $GITHUB_STEP_SUMMARY
          gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region=${{ env.REGION }} \
            --format="table(status.conditions[0].message, metadata.generation)" >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "**Frontend Service:**" >> $GITHUB_STEP_SUMMARY
          gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
            --region=${{ env.REGION }} \
            --format="table(status.conditions[0].message, metadata.generation)" >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Cloud SQL Instances" >> $GITHUB_STEP_SUMMARY
          for INSTANCE in ${{ env.CLOUD_SQL_INSTANCES }}; do
            echo "**Instance:** ${INSTANCE}" >> $GITHUB_STEP_SUMMARY
            gcloud sql instances describe "${INSTANCE}" \
              --format="table(name, state, databaseVersion, settings.activationPolicy)" >> $GITHUB_STEP_SUMMARY || true
            echo "" >> $GITHUB_STEP_SUMMARY
          done
      
      - name: Notify status
        if: failure()
        run: |
          echo "⚠️ Service management action failed. Check logs above." >> $GITHUB_STEP_SUMMARY
          exit 1

  cost-tracking:
    name: Estimate Cost Savings
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Calculate estimated savings
        run: |
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "## 💰 Cost Savings Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services Managed:" >> $GITHUB_STEP_SUMMARY
          echo "- Cloud Run Backend" >> $GITHUB_STEP_SUMMARY
          echo "- Cloud Run Frontend" >> $GITHUB_STEP_SUMMARY
          echo "- Cloud SQL MySQL 8.0" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Schedule:" >> $GITHUB_STEP_SUMMARY
          echo "- **Stop:** 10:00 PM EST (3:00 AM UTC) daily" >> $GITHUB_STEP_SUMMARY
          echo "- **Start:** 8:00 AM EST (1:00 PM UTC) daily" >> $GITHUB_STEP_SUMMARY
          echo "- **Downtime:** 10 hours per day (approximately 42% of the day)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Estimated Monthly Savings:" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Estimated Monthly Cost | Savings (42%) |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|----------------------|----------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Cloud Run (2x services) | ~$30 | ~$13 |" >> $GITHUB_STEP_SUMMARY
          echo "| Cloud SQL | ~$80 | ~$34 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total** | **~$110** | **~$47/month** |" >> $GITHUB_STEP_SUMMARY
