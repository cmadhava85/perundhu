name: Scrape Bus Data

on:
  # Manual trigger
  workflow_dispatch:
  # Scheduled run - every day at 2 AM UTC
  schedule:
    - cron: '0 2 * * *'

jobs:
  scrape-mtc:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium
      
      - name: Install Chrome and ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          
          # ChromeDriver is usually bundled with Selenium Manager now, but ensure it's available
          which chromedriver || echo "ChromeDriver will be managed by Selenium"
      
      - name: Run MTC scraper
        run: |
          cd scripts
          python mtc_bus_scraper_selenium.py --output ../data/mtc_bus_timings --verbose
        continue-on-error: true
      
      - name: Upload MTC data as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mtc-bus-data-${{ github.run_number }}
          path: |
            data/mtc_bus_timings.json
            data/mtc_bus_timings.csv
          retention-days: 90
  
  scrape-tnstc:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium
      
      - name: Install Chrome and ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      
      - name: Run TNSTC scraper
        run: |
          cd scripts
          python tnstc_bus_scraper_selenium.py \
            --source-list tnstc_sources.txt \
            --dest-list tnstc_destinations.txt \
            --output ../data/tnstc_bus_routes \
            --rate-limit 2.0 \
            --verbose
        continue-on-error: true
      
      - name: Upload TNSTC data as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tnstc-bus-data-${{ github.run_number }}
          path: |
            data/tnstc_bus_routes.json
            data/tnstc_bus_routes.csv
          retention-days: 90
